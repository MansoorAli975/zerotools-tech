  <style>
    :root {

    .site-mockup { position: absolute; inset: 0 -6px 0 0; z-index: 0; width: calc(100% + 6px); height: 100%; object-fit: cover; object-position: center top; pointer-events: none; user-select: none; transform: translate(0,0) scale(1); transform-origin: 90% 55%; transition: transform 1.2s cubic-bezier(.16,1,.3,1),filter 1.2s cubic-bezier(.16,1,.3,1); }

    .choice-row { overflow: hidden; margin-top: 10px; }

    .business-result { position: absolute; top: 50%; left: clamp(22px,calc(42vw - 215px),calc(100vw - clamp(22px,5vw,76px) - min(410px,calc(100vw - 44px)) - clamp(18px,2vw,32px) - min(430px,calc(100vw - 490px)))); z-index: 3; width: min(430px,calc(100vw - 490px)); max-height: calc(100svh - 120px); overflow: auto; visibility: hidden; border: 1px solid rgba(255,255,255,.74); border-radius: 20px; opacity: 0; background: rgba(255,255,255,.96); box-shadow: 0 14px 38px rgba(22,34,53,.12); transform: translate(min(380px,28vw),calc(-50% + 10px)) scale(.92) rotate(.55deg); transform-origin: right center; transition: opacity .34s ease,transform .6s cubic-bezier(.22,.78,.24,1),box-shadow .6s ease,visibility 0s linear .6s; backdrop-filter: blur(10px); }

      .contact-panel { padding: 25px 20px 22px; }
      .disclaimer { position: relative; left: auto; bottom: auto; width: min(900px,calc(100vw - 28px)); margin: 12px auto 0; transform: none; font-size: 12.5px; }
    }

    @media (max-height:620px) and (min-width:721px) {

        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({

    function updatePauseControl() {
      const paused = manualPause || visibilityPause;
      if (paused !== playbackPaused) {
        playbackPaused = paused;
        progressLastTimestamp = 0;
        document.body.classList.toggle('demo-paused', paused);
        if (paused && activeDelay) {
          window.clearTimeout(activeDelay.timer);
          const elapsed = Math.min(activeDelay.remaining, performance.now() - activeDelay.started);
          const resolve = activeDelay.resolve;
          activeDelay = null;
          resolve(elapsed);
        }
        if (!paused) {
          const waiters = resumeWaiters;
          resumeWaiters = [];
          waiters.forEach(resolve => resolve());
        }
      }
      pauseResumeButton.textContent = manualPause ? 'Resume' : 'Pause';
      pauseResumeButton.setAttribute('aria-label', manualPause ? 'Resume demo' : 'Pause demo');
    }

    function waitUntilResumed() {
      return playbackPaused ? new Promise(resolve => resumeWaiters.push(resolve)) : Promise.resolve();
    }

    async function wait(milliseconds) {
      let remaining = milliseconds;
      const generation = delayGeneration;
      while (remaining > 0) {
        if (generation !== delayGeneration) return;
        await waitUntilResumed();
        if (generation !== delayGeneration) return;
        const elapsed = await new Promise(resolve => {
          const started = performance.now();
          const timer = window.setTimeout(() => {
            activeDelay = null;
            resolve(remaining);
          }, remaining);
          activeDelay = { timer, started, remaining, resolve };
        });
        if (generation !== delayGeneration) return;
        remaining = Math.max(0, remaining - elapsed);
      }
    }

    function renderProgress(value) {
      const clampedProgress = Math.max(0, Math.min(1, value));
      displayedProgress = clampedProgress;
      progressFill.style.transform = `scaleX(${clampedProgress})`;
    }

    function animateProgress(timestamp) {
      if (!progressTimerRunning) return;
      if (!progressLastTimestamp) progressLastTimestamp = timestamp;
      const elapsedSinceFrame = timestamp - progressLastTimestamp;
      progressLastTimestamp = timestamp;
      if (!playbackPaused) progressElapsed = Math.min(progressDuration, progressElapsed + elapsedSinceFrame);
      const ratio = progressDuration > 0 ? progressElapsed / progressDuration : 1;
      renderProgress(progressStartValue + (1 - progressStartValue) * ratio);
      if (ratio < 1) progressAnimationFrame = window.requestAnimationFrame(animateProgress);
      else {
        progressAnimationFrame = 0;
        progressTimerRunning = false;
      }
    }

    function startProgressTimer(duration, startValue = 0) {
      if (progressAnimationFrame) window.cancelAnimationFrame(progressAnimationFrame);
      progressAnimationFrame = 0;
      progressStartValue = Math.max(0, Math.min(1, startValue));
      progressDuration = Math.max(0, duration);
      progressLastTimestamp = 0;
      progressElapsed = 0;
      progressTimerRunning = progressDuration > 0 && progressStartValue < 1;
      renderProgress(progressStartValue);
      if (!progressTimerRunning) return;
      progressAnimationFrame = window.requestAnimationFrame(animateProgress);
    }

    function resetProgressTimer() {
      if (progressAnimationFrame) window.cancelAnimationFrame(progressAnimationFrame);
      progressAnimationFrame = 0;
      progressTimerRunning = false;
      progressStartValue = 0;
      progressDuration = 0;
      progressElapsed = 0;
      progressLastTimestamp = 0;
      renderProgress(0);
    }

    function completeProgressTimer() {
      if (progressAnimationFrame) window.cancelAnimationFrame(progressAnimationFrame);
      progressAnimationFrame = 0;
      progressTimerRunning = false;
      renderProgress(1);
    }

    function cancelPendingDelay() {
      ++delayGeneration;
      if (!activeDelay) return;
      window.clearTimeout(activeDelay.timer);
      const resolve = activeDelay.resolve;
      const remaining = activeDelay.remaining;
      activeDelay = null;
      resolve(remaining);
    }

      if (text.length <= 60) return DEMO_CONFIG.timing.shortBotReadingPause;
      if (text.length <= 120) return DEMO_CONFIG.timing.mediumBotReadingPause;
      return DEMO_CONFIG.timing.longBotReadingPause;
    }

    async function playInitialLauncherSequence() {
      const sequenceId = ++launcherRunId;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const touchSized = window.matchMedia('(max-width: 720px), (pointer: coarse)').matches;
      await wait(DEMO_CONFIG.timing.launcherDelay);
      if (sequenceId !== launcherRunId || chatOpened) return;

      if (!reducedMotion) {
        launcherWrap.classList.add('show-attention');
        trackDemoEvent('launcher_attention_shown');
        await wait(850);
        launcherWrap.classList.remove('show-attention');
        if (sequenceId !== launcherRunId || chatOpened) return;
      }

      if (reducedMotion || touchSized) {
        chatLauncher.classList.add('is-script-hover');
        await wait(reducedMotion ? 40 : 300);
        if (sequenceId !== launcherRunId || chatOpened) return;
        showLauncherRipple();
        chatLauncher.classList.add('is-pressed');
        await wait(reducedMotion ? 220 : DEMO_CONFIG.timing.mobileTapPause);
        if (sequenceId !== launcherRunId || chatOpened) return;
        await openChatWindow();
        return;
      }

      demoCursor.classList.add('is-visible');
      await wait(DEMO_CONFIG.timing.cursorRevealPause);
      if (sequenceId !== launcherRunId || chatOpened) return;
      const launcherRect = chatLauncher.querySelector('.sn-contact-icon').getBoundingClientRect();
      const cursorRect = demoCursor.getBoundingClientRect();
      const cursorX = launcherRect.left + launcherRect.width * .58 - cursorRect.left;
      const cursorY = launcherRect.top + launcherRect.height * .58 - cursorRect.top;
      demoCursor.style.setProperty('--cursor-x', `${cursorX}px`);
      demoCursor.style.setProperty('--cursor-y', `${cursorY}px`);
      await wait(DEMO_CONFIG.timing.cursorTravel);
      if (sequenceId !== launcherRunId || chatOpened) return;
      chatLauncher.classList.add('is-script-hover');
      await wait(300);
      if (sequenceId !== launcherRunId || chatOpened) return;
      await wait(DEMO_CONFIG.timing.cursorHoverPause);
      demoCursor.classList.add('is-pressing');
      chatLauncher.classList.add('is-pressed');
      showLauncherRipple();
      await wait(DEMO_CONFIG.timing.cursorPress);
      if (sequenceId !== launcherRunId || chatOpened) return;
      await openChatWindow();
    }

    function scrollToLatest() {

    function addBotAvatar(row) {

    function addTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'message-row bot';

      if (lastMessageRole === 'bot') row.classList.add('continuation');
      else addBotAvatar(row);
      row.insertAdjacentHTML('beforeend', '<div class="bubble typing" aria-label="Chatbot is typing"><i></i><i></i><i></i></div>');

    function addMessage(item) {
      const row = document.createElement('div');
      row.className = `message-row ${item.role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const text = document.createElement('span');
      text.className = 'message-text';
      text.textContent = item.textFrom ? DEMO_CONFIG[item.textFrom] : item.text;
      bubble.appendChild(text);
      if (item.role === 'bot') {
        if (lastMessageRole === 'bot') row.classList.add('continuation');
        else addBotAvatar(row);

      messagesElement.appendChild(row);

    function showChoices(item) {
      const botRow = messagesElement.lastElementChild;
      const bubble = botRow.querySelector('.bubble');
      const choiceRow = document.createElement('div');
      choiceRow.className = 'choice-row';
      const panel = document.createElement('div');
      panel.className = 'choice-panel';
      panel.setAttribute('aria-label', 'Available choices');
      item.options.forEach(optionText => {
        const option = document.createElement('div');
        option.className = 'choice-option';
        option.textContent = optionText;
        option.dataset.value = optionText;
        panel.appendChild(option);
      });
      botRow.classList.add('has-choices');
      choiceRow.appendChild(panel);
      bubble.appendChild(choiceRow);
      panel.style.maxHeight = `${panel.scrollHeight}px`;
      scrollToLatest();
      return choiceRow;
    }

    function markSelected(choiceRow, selectedValue) {
      const selectedOption = Array.from(choiceRow.querySelectorAll('.choice-option')).find(option => option.dataset.value === selectedValue);
      if (selectedOption) {
        selectedOption.classList.add('selected');
        selectedOption.setAttribute('aria-label', `${selectedValue}, selected`);
      }
    }

    async function collapseChoices(choiceRow) {
      choiceRow.querySelector('.choice-panel').classList.add('collapsing');
      await wait(DEMO_CONFIG.timing.choiceCollapse);
      choiceRow.remove();
    }

    function resetComposer() {
      composerInput.value = '';
      composerInput.blur();
      sendButton.classList.remove('active', 'sending');
    }

    async function simulateComposerEntry(item, currentRun) {
      const isOpening = item.entryMode === 'opening';
      const delays = isOpening ? DEMO_CONFIG.timing.openingCharacterDelays : DEMO_CONFIG.timing.contactCharacterDelays;
      composerInput.focus({ preventScroll: true });
      composerInput.setSelectionRange(0,0);
      for (const [index, character] of Array.from(item.text).entries()) {
        await wait(delays[index % delays.length]);
        if (currentRun !== runId) return false;
        composerInput.value += character;
        if (!cameraNoticeStarted) {
          cameraNoticeStarted = true;
          cameraNoticeElapsed = 0;
        } else if (!cameraFocusStarted) {
          cameraNoticeElapsed += delays[index % delays.length];
        }
        if (!cameraFocusStarted && cameraNoticeElapsed >= 800) {
          cameraFocusStarted = true;
          document.body.classList.remove('chat-focus-returning');
          document.body.classList.add('chat-focus-mode');
          trackDemoEvent('camera_focus_started', { noticeDelay: cameraNoticeElapsed });
        }
        sendButton.classList.add('active');
        composerInput.setSelectionRange(composerInput.value.length,composerInput.value.length);
        if (isOpening && character === '.') await wait(DEMO_CONFIG.timing.openingSentencePause);
        if (isOpening && character === ',') await wait(DEMO_CONFIG.timing.openingClausePause);
        if (!isOpening && (index === 3 || index === 11)) await wait(DEMO_CONFIG.timing.contactGroupPause);
      }
      await wait(isOpening ? DEMO_CONFIG.timing.openingTypedPause : DEMO_CONFIG.timing.contactTypedPause);
      if (currentRun !== runId) return false;
      sendButton.classList.add('sending');
      await wait(isOpening ? DEMO_CONFIG.timing.openingSendPress : DEMO_CONFIG.timing.contactSendPress);
      if (currentRun !== runId) return false;
      resetComposer();
      addMessage({ role: 'visitor', text: item.text });
      return true;
    }

    async function playConversation({ replayPlayback = false } = {}) {
      const currentRun = ++runId;
      isReplayPlayback = replayPlayback;
      cameraFocusStarted = replayPlayback;
      cameraNoticeStarted = replayPlayback;
      cameraNoticeElapsed = replayPlayback ? 800 : 0;
      manualPause = false;
      playbackSkipped = false;
      playbackActive = true;
      updatePauseControl();
      if (replayPlayback) {
        document.body.classList.remove('chat-focus-returning');
        document.body.classList.add('chat-focus-mode');
      } else {
        document.body.classList.remove('chat-focus-mode', 'chat-focus-returning');
      }
      messagesElement.replaceChildren();
      messagesElement.scrollTop = 0;
      lastMessageRole = null;
      resetComposer();
      hideResultPresentation();
      replayButton.disabled = false;
      pauseResumeButton.disabled = false;
      skipResultButton.disabled = false;
      startProgressTimer(DEMO_CONFIG.conversationTimerDuration);
      trackDemoEvent('demo_started');

      await wait(DEMO_CONFIG.timing.initialSettle);
      if (currentRun !== runId) return;

      for (const [itemIndex, item] of DEMO_CONFIG.conversationSequence.entries()) {
        await wait(item.delay);
        if (currentRun !== runId) return;
        if (item.type === 'choice') {
          const choiceRow = showChoices(item);
          await wait(item.selectionDelay);
          if (currentRun !== runId) return;
          markSelected(choiceRow,item.selected);
          await wait(DEMO_CONFIG.timing.selectedHighlight);
          if (currentRun !== runId) return;
          await collapseChoices(choiceRow);
          if (currentRun !== runId) return;
          addMessage({ role: 'visitor choice', text: item.visitorLabel || item.selected });
          await wait(item.afterSelection);
          if (currentRun !== runId) return;
          continue;
        }
        if (item.type === 'composer-entry') {
          if (!await simulateComposerEntry(item,currentRun)) return;
          await wait(DEMO_CONFIG.timing.visitorMessagePause);
          if (currentRun !== runId) return;
          continue;
        }
        if (item.role === 'bot') {
          const typing = addTypingIndicator();
          await wait(item.typing);
          if (currentRun !== runId) return;
          typing.remove();
        }
        addMessage(item);
        const isFinalBotMessage = itemIndex === DEMO_CONFIG.conversationSequence.length - 1 && item.role === 'bot';
        if (isFinalBotMessage) completeProgressTimer();
        if (item.role === 'bot') {
          await wait(isFinalBotMessage ? DEMO_CONFIG.timing.finalMessageHold : getBotReadingDelay(item));
          if (currentRun !== runId) return;
        }
      }

      closeChatAndRestoreLauncher();
      await wait(DEMO_CONFIG.timing.chatCloseSettle);
      if (currentRun !== runId) return;
      restoreNaturalSiteState();
      const siteRestoreDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : DEMO_CONFIG.timing.siteRestoreDuration;
      await wait(siteRestoreDuration);
      if (currentRun !== runId) return;
      await wait(DEMO_CONFIG.timing.cleanSiteRevealHold);
      if (currentRun !== runId) return;
      showResultPresentation();
      await wait(DEMO_CONFIG.timing.resultRevealTime);
      if (currentRun === runId) {
        playbackActive = false;
        pauseResumeButton.disabled = true;
        skipResultButton.disabled = true;
        replayButton.disabled = false;
        scrollMobileElementIntoView(businessResult);
        trackDemoEvent('demo_completed');
        trackDemoEvent('result_shown');
      }
    }

    function scrollMobileElementIntoView(element) {
      if (!window.matchMedia('(max-width: 720px)').matches) return;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.requestAnimationFrame(() => {
        element.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center', inline: 'nearest' });
      });
    }

    function toggleManualPause() {
      if (!playbackActive) return;
      if (manualPause) {
        manualPause = false;
        updatePauseControl();
        scrollToLatest();
        trackDemoEvent('demo_resumed_manual');
      } else {
        manualPause = true;
        updatePauseControl();
        trackDemoEvent('demo_paused_manual');
      }
    }

    async function skipToResult() {
      if (!playbackActive) return;
      trackDemoEvent('skip_to_result');
      playbackSkipped = true;
      playbackActive = false;
      const skipRunId = ++runId;
      ++launcherRunId;
      manualPause = false;
      visibilityPause = false;
      updatePauseControl();
      cancelPendingDelay();
      resetComposer();
      messagesElement.querySelectorAll('[data-typing="true"], .choice-row').forEach(element => element.remove());
      completeProgressTimer();
      pauseResumeButton.disabled = true;
      skipResultButton.disabled = true;
      closeChatAndRestoreLauncher();
      await wait(DEMO_CONFIG.timing.chatCloseSettle);
      if (skipRunId !== runId) return;
      restoreNaturalSiteState();
      const siteRestoreDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : DEMO_CONFIG.timing.siteRestoreDuration;
      await wait(siteRestoreDuration);
      if (skipRunId !== runId) return;
      await wait(DEMO_CONFIG.timing.skipCleanSiteRevealHold);
      if (skipRunId !== runId) return;
      showResultPresentation();
      replayButton.disabled = false;
      scrollMobileElementIntoView(businessResult);
      trackDemoEvent('demo_completed', { skipped: true });
      trackDemoEvent('result_shown', { skipped: true });
    }

    async function replayConversation() {
      trackDemoEvent('replay_clicked');
      const wasFocused = document.body.classList.contains('chat-focus-mode');
      isReplayPlayback = true;
      ++runId;
      cancelPendingDelay();
      manualPause = false;
      visibilityPause = false;
      playbackPaused = false;
      playbackActive = false;
      playbackSkipped = false;
      resumeWaiters.splice(0).forEach(resolve => resolve());
      document.body.classList.remove('demo-paused');
      pauseResumeButton.textContent = 'Pause';
      pauseResumeButton.setAttribute('aria-label','Pause demo');
      replayButton.disabled = true;
      pauseResumeButton.disabled = true;
      skipResultButton.disabled = true;
      messagesElement.replaceChildren();
      messagesElement.scrollTop = 0;
      lastMessageRole = null;
      resetComposer();
      resetProgressTimer();
      businessResult.classList.remove('visible');
      businessResult.setAttribute('aria-hidden','true');
      if (!wasFocused) {
        document.body.classList.remove('chat-focus-returning');
        document.body.classList.add('chat-replay-refocus');
        void siteMockup.offsetWidth;
        document.body.classList.add('chat-focus-mode');
        const replayRefocusDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 550;
        if (replayRefocusDelay) await wait(replayRefocusDelay);
        document.body.classList.remove('chat-replay-refocus');
      }
      playConversation({ replayPlayback: true });
      scrollMobileElementIntoView(chatShell);
    }

    async function replayFullDemo() {
      ++runId;
      ++launcherRunId;
      cancelPendingDelay();
      manualPause = false;
      visibilityPause = false;
      playbackPaused = false;
      playbackActive = false;
      playbackSkipped = false;
      isReplayPlayback = false;
      cameraFocusStarted = false;
      cameraNoticeStarted = false;
      cameraNoticeElapsed = 0;
      resumeWaiters.splice(0).forEach(resolve => resolve());
      document.body.classList.remove('demo-paused');
      pauseResumeButton.textContent = 'Pause';
      pauseResumeButton.setAttribute('aria-label', 'Pause demo');
      replayButton.disabled = false;
      pauseResumeButton.disabled = true;
      skipResultButton.disabled = true;
      hideResultPresentation();
      contactModal.classList.remove('is-open');
      contactModal.setAttribute('aria-hidden', 'true');
      restoreNaturalSiteState();
      messagesElement.replaceChildren();
      messagesElement.scrollTop = 0;
      lastMessageRole = null;
      resetComposer();
      resetProgressTimer();
      await waitForPaintFrames(2);
      playInitialLauncherSequence();
    }

    async function waitForPaintFrames(count = 2) {
      for (let frame = 0; frame < count; frame += 1) {
        await new Promise(resolve => window.requestAnimationFrame(resolve));
      }
    }

    function waitForSiteMockupState() {
      return new Promise(resolve => {
        let resolved = false;
        const finish = loaded => {
          if (resolved) return;
          resolved = true;
          siteMockup.removeEventListener('load', handleLoad);
          siteMockup.removeEventListener('error', handleError);
          resolve(loaded);
        };
        const handleLoad = () => finish(siteMockup.naturalWidth > 0);
        const handleError = () => finish(false);
        siteMockup.addEventListener('load', handleLoad);
        siteMockup.addEventListener('error', handleError);
        if (siteMockup.complete) finish(siteMockup.naturalWidth > 0);
      });
    }

    async function scheduleInitialLauncherSequence() {
      if (initialSequenceScheduled) return;
      initialSequenceScheduled = true;
      const postImageDelay = 400;
      let imageLoaded = await waitForSiteMockupState();

      if (imageLoaded && typeof siteMockup.decode === 'function') {
        try {
          await siteMockup.decode();
        } catch {
          imageLoaded = siteMockup.complete && siteMockup.naturalWidth > 0;
        }
      }

      if (!imageLoaded) siteMockup.classList.add('is-missing');
      await waitForPaintFrames(2);
      window.setTimeout(playInitialLauncherSequence, postImageDelay);
    }

    applyConfig();
    trackDemoEvent('page_view');
    chatLauncher.addEventListener('click',openChatWindow);
    replayButton.addEventListener('click',hideResultPresentation);
    replayButton.addEventListener('click',replayConversation);
    replayDemoButton.addEventListener('click',replayFullDemo);
    resultMinimizeButton.addEventListener('click',toggleResultMinimized);
    resultRestoreButton.addEventListener('click',() => setResultMinimized(false));
    pauseResumeButton.addEventListener('click',toggleManualPause);
    skipResultButton.addEventListener('click',skipToResult);
    contactTrigger.addEventListener('click',() => { trackDemoEvent('cta_clicked'); openContactPanel(); });
    resultDiscussMinimizedButton.addEventListener('click',() => { trackDemoEvent('cta_clicked'); openContactPanel(); });
    contactClose.addEventListener('click',closeContactPanel);
    copyEmailButton.addEventListener('click',copyContactEmail);
    contactModal.addEventListener('click',event => { if (event.target === contactModal) closeContactPanel(); });
    document.addEventListener('keydown',event => { if (event.key === 'Escape') closeContactPanel(); });
    document.addEventListener('visibilitychange',() => {
      if (!playbackActive) return;
      if (document.hidden && !manualPause) {
        visibilityPause = true;
        updatePauseControl();
        trackDemoEvent('demo_paused_visibility');
      } else if (!document.hidden && visibilityPause) {
        visibilityPause = false;
        updatePauseControl();
        trackDemoEvent('demo_resumed_visibility');
      }
    });
    scheduleInitialLauncherSequence();
  </script>
</body>
</html>
