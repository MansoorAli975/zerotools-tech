  <style>
    :root {
      --brand: #603d66;
      --brand-dark: #452a49;
      --brand-warm: #af7962;
      --zero-tools-blue: #603d66;
      --ink: #182231;
      --muted: #687486;
      --surface: #fff;
      --line: #e5e9ef;
      --page: #eef1f4;
      --shadow: 0 24px 70px rgba(22,34,53,.22);
      --launcher-bottom-offset: 88px;
      --chat-window-bottom-offset: 123px;
      --mobile-launcher-bottom-offset: 82px;
      --mobile-chat-window-bottom-offset: 72px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--page); }
    button, input { font: inherit; }

    .presentation {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      padding: 28px clamp(22px,5vw,76px);
      background:
        linear-gradient(90deg,rgba(246,248,250,.98) 0%,rgba(246,248,250,.88) 48%,rgba(232,236,241,.78) 100%),
        linear-gradient(135deg,#f7f8fa,#dde2e8);
    }

    .site-mockup { position: absolute; inset: 0 -6px 0 0; z-index: 0; width: calc(100% + 6px); height: 100%; object-fit: cover; object-position: center top; pointer-events: none; user-select: none; }
    .site-mockup.is-missing { display: none; }
    .presentation::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg,rgba(13,20,28,.04),rgba(13,20,28,.01)); }

    .concept-tools { position: fixed; z-index: 4; top: clamp(112px,13.2svh,144px); left: 50%; display: inline-flex; align-items: center; transform: translateX(-50%); }
    .concept-label { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 8px 12px; border: 1px solid rgba(255,255,255,.65); border-radius: 999px; color: #fff; background: rgba(23,63,74,.86); box-shadow: 0 7px 20px rgba(15,23,42,.2); font-size: 12px; font-weight: 800; letter-spacing: .01em; backdrop-filter: blur(8px); }
    .concept-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #7de2bc; box-shadow: 0 0 0 4px rgba(125,226,188,.17); }
    .concept-label a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.58); text-underline-offset: 2px; }
    .concept-label a:hover { text-decoration-color: currentColor; }
    .concept-label a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 2px; }

    .chat-shell { position: absolute; right: max(12px,calc(clamp(22px,5vw,76px) - 20px)); bottom: var(--chat-window-bottom-offset); z-index: 3; display: flex; flex-direction: column; width: min(405px,calc(100vw - 44px)); height: min(655px,calc(100svh - var(--chat-window-bottom-offset) - 24px)); min-height: 510px; overflow: hidden; opacity: 1; transform: scale(1); transform-origin: right bottom; visibility: visible; border: 1px solid rgba(255,255,255,.72); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); transition: opacity .62s ease,transform .62s cubic-bezier(.2,.8,.2,1),visibility 0s linear 0s; }
    .chat-shell.is-closed { pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(28px) scale(.86); transition: opacity .28s ease,transform .28s ease,visibility 0s linear .28s; }

    .launcher-wrap { position: fixed; right: max(16px,calc(clamp(28px,4vw,64px) - 8px)); bottom: var(--launcher-bottom-offset); z-index: 6; display: flex; align-items: center; gap: 2px; opacity: 1; transition: opacity .24s ease,transform .24s ease,visibility 0s linear 0s; }
    .launcher-wrap.is-hidden { pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(8px) scale(.92); transition-delay: 0s,0s,.24s; }
    .launcher-tooltip { width: 148px; padding: 7px 10px; border: 1px solid rgba(255,255,255,.72); border-radius: 9px; color: #fff; background: color-mix(in srgb,var(--brand-dark) 92%,transparent); box-shadow: 0 7px 20px rgba(5,11,25,.22); font-size: 11px; font-weight: 750; text-align: center; white-space: nowrap; }
    .chat-launcher { position: relative; display: grid; width: 72px; height: 72px; place-items: center; overflow: visible; border: 2px solid rgba(255,255,255,.88); border-radius: 50%; color: #fff; background: linear-gradient(145deg,var(--brand),var(--brand-dark)); box-shadow: 0 12px 28px rgba(5,11,25,.34); cursor: pointer; animation: launcher-pulse 2.4s ease-in-out infinite; transition: transform .16s ease,box-shadow .16s ease; }
    .chat-launcher:hover { transform: translateY(-2px); box-shadow: 0 15px 32px rgba(5,11,25,.4); }
    .chat-launcher:focus-visible { outline: 3px solid color-mix(in srgb,var(--brand) 55%,white); outline-offset: 4px; }
    .chat-launcher.is-pressed { transform: scale(.9); box-shadow: 0 6px 14px rgba(5,11,25,.32); }
    .launcher-image { display: block; width: 64px; height: 64px; padding: 1px; border-radius: 50%; object-fit: contain; object-position: center; }
    .launcher-id { display: none; }
    .launcher-ripple { position: absolute; inset: 50%; width: 20px; height: 20px; pointer-events: none; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; opacity: 0; transform: translate(-50%,-50%) scale(.4); }
    .chat-launcher.show-ripple .launcher-ripple { animation: launcher-ripple .55s ease-out; }

    .apex-whatsapp { position: fixed; right: max(16px,calc(clamp(28px,4vw,64px) - 8px)); bottom: 28px; z-index: 5; display: block; width: 180px; }
    .apex-whatsapp img { display: block; width: 100%; height: auto; }

    .demo-cursor { --cursor-x: 0px; --cursor-y: 0px; position: fixed; right: 18px; bottom: 30px; z-index: 8; width: 27px; height: 34px; pointer-events: none; visibility: hidden; opacity: 0; transform: translate(var(--cursor-x),var(--cursor-y)); transition: transform 1.08s cubic-bezier(.2,.76,.25,1),opacity .18s ease; filter: drop-shadow(0 2px 2px rgba(0,0,0,.28)); }
    .demo-cursor.is-visible { visibility: visible; opacity: 1; }
    .demo-cursor.is-pressing { transform: translate(var(--cursor-x),var(--cursor-y)) scale(.88); }
    .demo-cursor svg { width: 100%; height: 100%; fill: #fff; stroke: #111827; stroke-width: 1.25; stroke-linejoin: round; }
    .chat-header { display: flex; flex: 0 0 auto; align-items: center; gap: 11px; min-height: 76px; padding: 14px 15px; color: #fff; background: linear-gradient(135deg,var(--brand-dark),var(--brand)); }
    .avatar, .message-avatar { display: grid; flex: 0 0 auto; place-items: center; border-radius: 50%; color: #fff; background: rgba(255,255,255,.16); font-weight: 900; }
    .avatar { width: 45px; height: 45px; border: 1px solid rgba(255,255,255,.35); font-size: 14px; }
    .chat-title { min-width: 0; flex: 1; }
    .chat-title strong { display: block; overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .chat-title span { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; opacity: .88; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7de2bc; box-shadow: 0 0 0 3px rgba(125,226,188,.15); }
    .replay { padding: 7px 10px; border: 1px solid rgba(255,255,255,.27); border-radius: 10px; color: rgba(255,255,255,.88); background: rgba(255,255,255,.08); font-size: 11px; font-weight: 800; cursor: pointer; transition: .18s ease; }
    .replay:hover { border-color: rgba(255,255,255,.4); color: #fff; background: rgba(255,255,255,.14); }
    .replay:active { transform: scale(.97); }
    .replay:focus-visible { outline: 3px solid color-mix(in srgb,var(--brand) 40%,transparent); outline-offset: 2px; }
    .replay:disabled { cursor: not-allowed; opacity: .5; }

    .messages { min-height: 0; flex: 1 1 auto; overflow-y: auto; padding: 18px 16px 24px; background: linear-gradient(180deg,#fbfcfd,#f7f8fa); scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: rgba(122,132,144,.22) transparent; }
    .messages::-webkit-scrollbar { width: 2px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(122,132,144,.22); }
    .messages::-webkit-scrollbar-thumb:hover { background: rgba(122,132,144,.38); }

    .composer-area { flex: 0 0 auto; padding: 8px 11px 6px; border-top: 1px solid #ddd8d3; background: #f8f7f5; }
    .composer { display: flex; align-items: center; gap: 7px; min-height: 46px; padding: 6px 7px 6px 10px; border: 1px solid #d7dce2; border-radius: 15px; background: #fff; box-shadow: 0 2px 7px rgba(33,43,54,.04); transition: border-color .18s ease,box-shadow .18s ease; }
    .composer-input { min-width: 0; height: 34px; flex: 1; padding: 0 3px; border: 0; outline: 0; color: #3d4754; background: transparent; font-size: 12.5px; caret-color: var(--brand); }
    .composer-input::placeholder { color: #929ba8; }
    .composer:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb,var(--brand) 10%,transparent); }
    .composer-icon { display: grid; width: 20px; height: 20px; flex: 0 0 auto; place-items: center; color: #86919f; }
    .composer-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .send-button { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 10px; color: #9ba4af; background: #eef0f2; pointer-events: none; transition: color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease; }
    .send-button svg { width: 16px; height: 16px; fill: currentColor; transform: translateX(1px); }
    .send-button.active, .send-button.sending { color: #fff; background: var(--brand); box-shadow: 0 2px 7px color-mix(in srgb,var(--brand) 24%,transparent); }
    .send-button.sending { transform: scale(.9); }
    .powered-by { margin: 5px 0 0; color: #8a939e; font-size: 9px; font-weight: 700; text-align: center; }

    .message-row { display: flex; margin: 0 0 12px; opacity: 0; transform: translateY(8px); animation: message-in .34s ease forwards; }
    .message-row.bot { align-items: flex-end; gap: 8px; }
    .message-row.bot.continuation { padding-left: 36px; }
    .message-row.visitor { justify-content: flex-end; }
    .message-avatar { width: 28px; height: 28px; border: 1px solid color-mix(in srgb,var(--brand-warm) 38%,transparent); color: var(--brand-dark); background: color-mix(in srgb,var(--brand) 10%,white); font-size: 9px; }
    .bubble { max-width: 84%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 15px 15px 15px 5px; color: #303b49; background: #fff; box-shadow: 0 3px 10px rgba(33,43,54,.05); font-size: 12.5px; line-height: 1.52; white-space: pre-line; }
    .visitor .bubble { border-color: var(--brand); border-radius: 15px 15px 5px 15px; color: #fff; background: var(--brand); }
    .message-row.bot.has-choices .bubble { width: min(92%,320px); max-width: 92%; }
    .message-text { display: block; }

    .choice-row { overflow: hidden; margin-top: 10px; }
    .choice-panel { display: grid; gap: 7px; max-height: 280px; overflow: hidden; transform-origin: top; transition: max-height .3s ease,margin .3s ease,padding .3s ease,opacity .22s ease,transform .3s ease; }
    .choice-panel.collapsing { max-height: 0 !important; margin: 0; padding: 0; opacity: 0; transform: scaleY(.92); }
    .choice-option { padding: 9px 10px; border: 1px solid color-mix(in srgb,var(--brand) 30%,#d8dee5); border-radius: 10px; color: var(--brand-dark); background: color-mix(in srgb,var(--brand) 5%,white); font-size: 11.5px; font-weight: 750; transition: color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease; }
    .choice-option.selected { border-color: var(--brand); color: #fff; background: var(--brand); transform: translateX(2px); }

    .business-result { position: absolute; top: 50%; left: clamp(22px,calc(42vw - 215px),calc(100vw - max(12px,calc(clamp(22px,5vw,76px) - 20px)) - min(405px,calc(100vw - 44px)) - clamp(18px,2vw,32px) - min(430px,calc(100vw - 490px)))); z-index: 3; width: min(430px,calc(100vw - 490px)); max-height: calc(100svh - 120px); overflow: auto; visibility: hidden; border: 1px solid rgba(255,255,255,.74); border-radius: 20px; opacity: 0; background: rgba(255,255,255,.96); box-shadow: 0 14px 38px rgba(22,34,53,.12); transform: translate(min(400px,29vw),calc(-50% + 10px)) scale(.92) rotate(.55deg); transform-origin: right center; transition: opacity .34s ease,transform .6s cubic-bezier(.22,.78,.24,1),box-shadow .6s ease,visibility 0s linear .6s; backdrop-filter: blur(10px); }
    .business-result.visible { visibility: visible; opacity: 1; box-shadow: var(--shadow); transform: translate(0,-50%) scale(1) rotate(0); transition-delay: 0s; }
    .summary-heading { padding: 20px 22px 16px; border-bottom: 1px solid #e6e9ed; color: var(--ink); font-size: 18px; font-weight: 900; }
    .summary-heading::before { content: "✓"; display: inline-grid; width: 22px; height: 22px; margin-right: 8px; place-items: center; border-radius: 50%; color: #fff; background: var(--brand); font-size: 12px; vertical-align: 2px; }
    .summary-support { display: block; margin: 6px 0 0 31px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
    .summary-list { margin: 0; padding: 7px 22px 13px; }
    .summary-item { display: grid; grid-template-columns: 118px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid #edf0f3; font-size: 12.5px; }
    .summary-item:last-child { border-bottom: 0; }
    .summary-item dt { color: var(--muted); }
    .summary-item dd { margin: 0; color: var(--ink); font-weight: 700; text-align: left; }
    .result-cta { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 22px 15px; border-top: 1px solid #e6e9ed; opacity: 0; background: rgba(247,249,252,.9); transform: translateY(5px); transition: opacity .24s ease .52s,transform .24s ease .52s; }
    .business-result.visible .result-cta { opacity: 1; transform: none; }
    .result-cta p { margin: 0; color: #465365; font-size: 11.5px; font-weight: 700; line-height: 1.35; }
    .contact-trigger { flex: 0 0 auto; padding: 8px 11px; border: 0; border-radius: 9px; color: #fff; background: #172b4d; font-size: 11px; font-weight: 800; cursor: pointer; }
    .contact-trigger:hover { background: #223d68; }
    .contact-trigger:focus-visible, .contact-close:focus-visible, .copy-email:focus-visible, .contact-action:focus-visible, .contact-site-link:focus-visible { outline: 3px solid rgba(56,132,255,.42); outline-offset: 2px; }

    .contact-modal { position: fixed; inset: 0; z-index: 30; display: grid; padding: 20px; place-items: center; overflow-y: auto; visibility: hidden; opacity: 0; background: rgba(9,18,31,.48); transition: opacity .2s ease,visibility 0s linear .2s; }
    .contact-modal.is-open { visibility: visible; opacity: 1; transition-delay: 0s; }
    .contact-panel { position: relative; width: min(430px,100%); max-height: calc(100svh - 40px); overflow-y: auto; padding: 28px; border: 1px solid rgba(23,43,77,.15); border-radius: 18px; background: #fff; box-shadow: 0 26px 80px rgba(6,18,38,.32); transform: translateY(10px) scale(.98); transition: transform .2s ease; }
    .contact-modal.is-open .contact-panel { transform: none; }
    .contact-brand { margin: 0 0 5px; color: #172b4d; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .contact-title { margin: 0; color: #142238; font-size: 24px; line-height: 1.2; }
    .contact-intro { margin: 8px 0 20px; color: #627086; font-size: 14px; }
    .contact-close { position: absolute; top: 13px; right: 13px; display: grid; width: 34px; height: 34px; padding: 0; place-items: center; border: 0; border-radius: 50%; color: #526075; background: #f0f3f7; font-size: 22px; line-height: 1; cursor: pointer; }
    .email-copy-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 13px; border: 1px solid #dce3ec; border-radius: 11px; background: #f8fafc; }
    .email-address { min-width: 0; overflow-wrap: anywhere; color: #172b4d; font-size: 13.5px; font-weight: 800; }
    .copy-email { flex: 0 0 auto; padding: 6px 9px; border: 1px solid #cbd5e1; border-radius: 7px; color: #34445d; background: #fff; font-size: 11px; font-weight: 800; cursor: pointer; }
    .contact-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 13px; }
    .contact-action { display: grid; min-height: 42px; padding: 9px 12px; place-items: center; border-radius: 9px; color: #fff; background: #172b4d; font-size: 12px; font-weight: 800; text-align: center; text-decoration: none; }
    .contact-action.secondary { border: 1px solid #cbd5e1; color: #253750; background: #fff; }
    .contact-site-link { display: inline-block; margin-top: 18px; color: #53647b; font-size: 12px; font-weight: 750; text-decoration-color: #a7b1bf; text-underline-offset: 3px; }

    .typing { display: inline-flex; min-width: 48px; align-items: center; gap: 4px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: #9aa4b1; animation: typing 1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    .disclaimer { position: fixed; z-index: 2; left: clamp(22px,5vw,76px); bottom: 9px; width: min(1040px,calc(100vw - 568px)); margin: 0; padding: 7px 12px; border: 1px solid rgba(20,49,74,.13); border-radius: 8px; color: #172536; background: rgba(255,255,255,.9); box-shadow: 0 3px 12px rgba(17,31,48,.08); font-size: 12px; line-height: 1.33; font-weight: 600; text-align: left; backdrop-filter: blur(5px); }

    @keyframes message-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-3px); opacity: 1; } }
    @keyframes launcher-pulse { 0%,100% { box-shadow: 0 12px 28px rgba(5,11,25,.34),0 0 0 0 color-mix(in srgb,var(--brand) 22%,transparent); } 50% { box-shadow: 0 12px 28px rgba(5,11,25,.34),0 0 0 10px color-mix(in srgb,var(--brand) 0%,transparent); } }
    @keyframes launcher-ripple { 0% { opacity: .9; transform: translate(-50%,-50%) scale(.4); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(3.5); } }

    @media (min-width:1000px) and (max-width:1250px) {
      .site-mockup { top: 0; right: auto; bottom: auto; left: 0; width: 100%; height: auto; object-fit: contain; object-position: center top; }
      .concept-tools { left: calc((100vw - max(12px,calc(clamp(22px,5vw,76px) - 20px)) - min(405px,calc(100vw - 44px)) - 24px)/2); }
      .concept-label { white-space: nowrap; }
    }

    @media (max-width:768px) {
      .apex-whatsapp { display: none; }
    }

    @media (max-width:720px) {
      .presentation { min-height: 100svh; overflow: visible; padding: 16px; }
      .site-mockup { opacity: .35; }
      .concept-tools { position: relative; top: auto; left: auto; display: flex; width: fit-content; max-width: 100%; margin: 0 auto; transform: none; }
      .concept-label { width: fit-content; max-width: 100%; font-size: 11px; text-align: center; }
      .chat-shell { position: relative; top: auto; right: auto; bottom: auto; width: min(410px,calc(100vw - 28px)); height: min(670px,calc(100svh - 92px - var(--mobile-chat-window-bottom-offset))); min-height: 500px; margin: 18px auto var(--mobile-chat-window-bottom-offset); transform: none; transform-origin: center bottom; }
      .chat-shell.is-closed { position: absolute; pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(22px) scale(.92); }
      .launcher-wrap { right: 24px; bottom: var(--mobile-launcher-bottom-offset); gap: 10px; }
      .launcher-tooltip { width: auto; font-size: 10.5px; }
      .chat-launcher { width: 68px; height: 68px; }
      .launcher-image { width: 60px; height: 60px; }
      .demo-cursor { display: none; }
      .chat-header { min-height: 70px; padding: 13px 14px; }
      .messages { padding: 16px 13px 22px; }
      .composer { min-height: 44px; padding: 5px 6px 5px 9px; }
      .composer-input { height: 32px; }
      .business-result { position: relative; top: auto; left: auto; width: min(410px,calc(100vw - 28px)); max-height: 0; margin: 0 auto; border-width: 0; opacity: 0; transform: translateY(14px) scale(.98); }
      .business-result.visible { max-height: 560px; margin-top: 18px; border-width: 1px; opacity: 1; transform: none; }
      .summary-heading { padding: 17px 18px 14px; font-size: 17px; }
      .summary-list { padding: 6px 18px 11px; }
      .summary-item { grid-template-columns: 105px 1fr; gap: 12px; }
      .result-cta { padding: 12px 18px 14px; }
      .contact-panel { padding: 25px 20px 22px; }
      .disclaimer { position: relative; left: auto; bottom: auto; width: min(900px,calc(100vw - 28px)); margin: 12px auto 0; transform: none; font-size: 12.5px; }
    }

    @media (max-height:620px) and (min-width:721px) {
      .chat-shell { height: calc(100svh - var(--chat-window-bottom-offset) - 24px); min-height: 0; }
      .disclaimer { bottom: 6px; font-size: 12.5px; }
    }

    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .messages { scroll-behavior: auto; }
      .typing i { animation: none; }
      .choice-panel, .business-result, .result-cta, .send-button, .composer-input { transition-duration: .01ms; transition-delay: 0s; }
      .contact-modal, .contact-panel { transition-duration: .01ms; }
      .chat-shell, .launcher-wrap { transition-duration: .18s; }
      .chat-launcher { animation: none; transition-duration: .01ms; }
      .demo-cursor { display: none; }
    }
  </style>
</head>
<body>

        <span class="launcher-ripple" aria-hidden="true"></span>

    <a class="apex-whatsapp" href="https://wa.me/96522020212" target="_blank" rel="noopener noreferrer" aria-label="Contact Apex Dental Clinic on WhatsApp">
      <img src="assets/apex-whatsapp-widget.png" alt="" width="494" height="80">
    </a>

    <div class="demo-cursor" id="demo-cursor" aria-hidden="true"><svg viewBox="0 0 28 36"><path d="M3 2.5 23 21l-9 .8 5 9-4.5 2.4-4.8-9-6.7 6.2V2.5Z"/></svg></div>

      <div class="composer-area">

          <input class="composer-input" id="composer-input" type="text" placeholder="Type a message…" readonly aria-readonly="true" autocomplete="off" spellcheck="false">
          <span class="composer-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1.8 2 5.2 2 7 0M9 9.5h.01M15 9.5h.01"/></svg></span>
          <button class="send-button" id="send-button" type="button" tabindex="-1" aria-disabled="true" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21.8 12 3.4 3.6 3 10.1l12.1 1.9L3 13.9l.4 6.5Z"/></svg></button>

  <div class="contact-modal" id="contact-modal" aria-hidden="true">
    <section class="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contact-title" aria-describedby="contact-intro">
      <button class="contact-close" id="contact-close" type="button" aria-label="Close contact panel">×</button>
      <p class="contact-brand">Zero Tools</p>
      <h2 class="contact-title" id="contact-title">Contact Zero Tools</h2>
      <p class="contact-intro" id="contact-intro">We’ll guide you through the next steps.</p>
      <div class="email-copy-row">
        <span class="email-address" id="contact-email-address"></span>
        <button class="copy-email" id="copy-email" type="button">Copy</button>
      </div>
      <div class="contact-actions">
        <a class="contact-action" id="gmail-link" target="_blank" rel="noopener noreferrer">Open Gmail</a>
        <a class="contact-action secondary" id="email-app-link">Open email app</a>

      <a class="contact-site-link" href="https://zerotools.tech/" target="_blank" rel="noopener noreferrer">Visit zerotools.tech →</a>

  </div>

  <script>
    const DEMO_CONFIG = {
      prospectName: 'Apex Dental Clinic',
      companyName: 'Apex Dental Clinic',
      shortCompanyName: 'Apex Dental Clinic',
      chatbotName: 'Apex Dental Assistant',
      botInitials: 'AD',
      backgroundImagePath: 'assets/company-homepage.png',
      backgroundImageAltText: 'Public homepage of Apex Dental Clinic used as the concept background',
      primaryBrandColour: '#603d66',
      secondaryBrandColour: '#452a49',
      launcherBottomOffset: '88px',
      chatWindowBottomOffset: '123px',
      mobileLauncherBottomOffset: '82px',
      mobileChatWindowBottomOffset: '72px',
      contactEmail: 'support@zerotools.tech',
      contactSubject: 'Apex Dental Clinic chatbot concept',
      contactBody: 'Hi, I reviewed the Apex Dental Clinic chatbot concept and would like to discuss it.',
      welcomeMessage: 'Welcome to Apex Dental Clinic. I’m the Apex Dental Assistant. How can I help you today?',
      conversationSequence: [
        { type: 'message', role: 'bot', delay: 0, typing: 1050, textFrom: 'welcomeMessage' },
        { type: 'composer-entry', delay: 0, entryMode: 'opening', text: "I'm interested in straightening my teeth, but I'm not sure whether Invisalign or braces would suit me." },
        { type: 'message', role: 'bot', delay: 0, typing: 1050, text: 'Apex offers both Invisalign and braces. The suitable option depends on your individual case and should be confirmed during a consultation.' },
        { type: 'message', role: 'bot', delay: 0, typing: 1050, text: 'What matters most to you when considering treatment?' },
        { type: 'choice', delay: 300, selectionDelay: 2000, afterSelection: 1100, options: ['A discreet option', 'A fixed option', 'Not sure yet'], selected: 'A discreet option', transcriptText: 'I would prefer a discreet treatment option.' },
        { type: 'message', role: 'bot', delay: 0, typing: 1050, text: 'Understood. Invisalign may be one of the options to discuss, but the dentist would need to assess your teeth before recommending the suitable treatment.' },
        { type: 'message', role: 'bot', delay: 0, typing: 1050, text: 'Would you like to request a consultation?' },
        { type: 'choice', delay: 300, selectionDelay: 2000, afterSelection: 1100, options: ['Yes, request consultation', 'I have another question', 'Not yet'], selected: 'Yes, request consultation', transcriptText: "Yes, I'd like to request a consultation." },
        { type: 'message', role: 'bot', delay: 0, typing: 1050, text: 'How would you prefer the clinic to contact you?' },
        { type: 'choice', delay: 300, selectionDelay: 2000, afterSelection: 1100, options: ['WhatsApp', 'Phone', 'Email'], selected: 'WhatsApp' },
        { type: 'message', role: 'bot', delay: 0, typing: 1050, text: 'Please enter your WhatsApp number, including the country code.' },
        { type: 'composer-entry', delay: 0, entryMode: 'contact', text: '+965 XXXX XXXX' },
        { type: 'message', role: 'bot', delay: 0, typing: 1050, text: 'Thank you. The clinic team can contact you on WhatsApp regarding your consultation request.' }
      ],
      enquiryResult: {
        title: 'Orthodontic consultation request',
        supportText: 'Example structured enquiry from this conversation',
        fields: [
          { label: 'Interest:', value: 'Teeth straightening' },
          { label: 'Preference:', value: 'Discreet treatment option' },
          { label: 'Options to discuss:', value: 'Invisalign / braces' },
          { label: 'Consultation requested:', value: 'Yes' },
          { label: 'Preferred contact:', value: 'WhatsApp' },
          { label: 'Phone:', value: '+965 XXXX XXXX' }
        ]
      },
      disclaimer: 'Temporary independent concept prepared by Zero Tools for private review using publicly available website information. It is not installed on or connected to Apex Dental Clinic’s live website. This preview will be removed 30 days after it is shared, or earlier upon request.',
      timing: {
        launcherDelay: 1800,
        cursorRevealPause: 120,
        cursorTravel: 1080,
        cursorHoverPause: 360,
        cursorPress: 280,
        mobileTapPause: 420,
        chatOpenDuration: 650,
        conversationStartDelay: 1200,
        initialSettle: 200,
        selectedHighlight: 650,
        choiceCollapse: 300,
        resultRevealPause: 2300,
        resultRevealTime: 600,
        visitorMessagePause: 2100,
        shortBotReadingPause: 2500,
        mediumBotReadingPause: 3600,
        longBotReadingPause: 5000,
        contactCharacterDelays: [170,180,165,195,260,175,205,250,180,165,190,280,200,175,185,170,190,180,205],
        contactGroupPause: 300,
        contactTypedPause: 800,
        contactSendPress: 325,
        openingCharacterDelays: [42,55,47,61,45,52,40,58,49,44,63,46],
        openingSentencePause: 360,
        openingClausePause: 300,
        openingTypedPause: 650,
        openingSendPress: 275
      }
    };

    const messagesElement = document.getElementById('messages');
    const replayButton = document.getElementById('replay');
    const businessResult = document.getElementById('business-result');
    const composerInput = document.getElementById('composer-input');
    const sendButton = document.getElementById('send-button');
    const siteMockup = document.getElementById('site-mockup');
    const chatShell = document.getElementById('chat-shell');
    const launcherWrap = document.getElementById('launcher-wrap');
    const chatLauncher = document.getElementById('chat-launcher');
    const launcherTooltip = document.getElementById('launcher-tooltip');
    const launcherId = document.getElementById('launcher-id');
    const demoCursor = document.getElementById('demo-cursor');
    const contactModal = document.getElementById('contact-modal');
    const contactTrigger = document.getElementById('contact-trigger');
    const contactClose = document.getElementById('contact-close');
    const copyEmailButton = document.getElementById('copy-email');
    let runId = 0;
    let lastMessageRole = null;
    let chatOpened = false;
    let launcherRunId = 0;
    let contactReturnFocus = null;
    let copyResetTimer = 0;
    let initialSequenceScheduled = false;

    function applyConfig() {
      document.documentElement.style.setProperty('--brand', DEMO_CONFIG.primaryBrandColour);
      document.documentElement.style.setProperty('--brand-dark', DEMO_CONFIG.secondaryBrandColour);
      document.documentElement.style.setProperty('--zero-tools-blue', DEMO_CONFIG.primaryBrandColour);
      document.documentElement.style.setProperty('--launcher-bottom-offset', DEMO_CONFIG.launcherBottomOffset);
      document.documentElement.style.setProperty('--chat-window-bottom-offset', DEMO_CONFIG.chatWindowBottomOffset);
      document.documentElement.style.setProperty('--mobile-launcher-bottom-offset', DEMO_CONFIG.mobileLauncherBottomOffset);
      document.documentElement.style.setProperty('--mobile-chat-window-bottom-offset', DEMO_CONFIG.mobileChatWindowBottomOffset);
      const conceptLabel = document.getElementById('concept-label');
      conceptLabel.replaceChildren(document.createTextNode(`Website Chatbot Concept for ${DEMO_CONFIG.prospectName} · Prepared by `));
      const zeroToolsLink = document.createElement('a');
      zeroToolsLink.href = 'https://zerotools.tech/';
      zeroToolsLink.target = '_blank';
      zeroToolsLink.rel = 'noopener noreferrer';
      zeroToolsLink.textContent = 'zerotools.tech';
      conceptLabel.appendChild(zeroToolsLink);
      document.getElementById('result-cta-copy').textContent = `Interested in this for ${DEMO_CONFIG.prospectName}?`;
      document.getElementById('header-avatar').textContent = DEMO_CONFIG.botInitials;
      document.getElementById('chatbot-name').textContent = DEMO_CONFIG.chatbotName;
      launcherId.textContent = DEMO_CONFIG.botInitials;
      launcherTooltip.textContent = 'Chat with Apex Assistant';
      chatLauncher.setAttribute('aria-label', `Open ${DEMO_CONFIG.chatbotName}`);
      document.getElementById('disclaimer').textContent = DEMO_CONFIG.disclaimer;
      siteMockup.alt = DEMO_CONFIG.backgroundImageAltText;
      siteMockup.addEventListener('error', () => siteMockup.classList.add('is-missing'), { once: true });
      siteMockup.src = DEMO_CONFIG.backgroundImagePath;
      const heading = document.getElementById('summary-heading');
      heading.textContent = DEMO_CONFIG.enquiryResult.title;
      const support = document.createElement('span');
      support.className = 'summary-support';
      support.textContent = DEMO_CONFIG.enquiryResult.supportText;
      heading.appendChild(support);
      document.getElementById('summary-list').replaceChildren(...DEMO_CONFIG.enquiryResult.fields.map(field => {
        const row = document.createElement('div');
        row.className = 'summary-item';
        const term = document.createElement('dt');
        const detail = document.createElement('dd');
        term.textContent = field.label;
        detail.textContent = field.value;
        row.append(term, detail);
        return row;
      }));
      const contactSubject = DEMO_CONFIG.contactSubject || `${DEMO_CONFIG.prospectName} chatbot concept`;
      const contactBody = DEMO_CONFIG.contactBody || `Hi, I reviewed the ${DEMO_CONFIG.prospectName} chatbot concept and would like to discuss it.`;
      const encodedContactSubject = encodeURIComponent(contactSubject);
      const encodedContactBody = encodeURIComponent(contactBody);
      document.getElementById('contact-email-address').textContent = DEMO_CONFIG.contactEmail;
      document.getElementById('gmail-link').href = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(DEMO_CONFIG.contactEmail)}&su=${encodedContactSubject}&body=${encodedContactBody}`;
      document.getElementById('email-app-link').href = `mailto:${DEMO_CONFIG.contactEmail}?subject=${encodedContactSubject}&body=${encodedContactBody}`;
    }

    const wait = milliseconds => new Promise(resolve => window.setTimeout(resolve, milliseconds));

    function openContactPanel() {
      contactReturnFocus = document.activeElement;
      contactModal.classList.add('is-open');
      contactModal.setAttribute('aria-hidden','false');
      contactClose.focus();
    }

    function closeContactPanel() {
      if (!contactModal.classList.contains('is-open')) return;
      contactModal.classList.remove('is-open');
      contactModal.setAttribute('aria-hidden','true');
      if (contactReturnFocus && typeof contactReturnFocus.focus === 'function') contactReturnFocus.focus();
    }

    async function copyContactEmail() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(DEMO_CONFIG.contactEmail);
        } else {
          const copyField = document.createElement('textarea');
          copyField.value = DEMO_CONFIG.contactEmail;
          copyField.setAttribute('readonly','');
          copyField.style.position = 'fixed';
          copyField.style.opacity = '0';
          document.body.appendChild(copyField);
          copyField.select();
          document.execCommand('copy');
          copyField.remove();
        }
        window.clearTimeout(copyResetTimer);
        copyEmailButton.textContent = 'Copied';
        copyResetTimer = window.setTimeout(() => { copyEmailButton.textContent = 'Copy'; },1800);
      } catch (error) {
        copyEmailButton.textContent = 'Copy failed';
        window.clearTimeout(copyResetTimer);
        copyResetTimer = window.setTimeout(() => { copyEmailButton.textContent = 'Copy'; },1800);
      }
    }

    function getBotReadingDelay(item) {
      const text = item.textFrom ? DEMO_CONFIG[item.textFrom] : item.text;
      if (text.length <= 60) return DEMO_CONFIG.timing.shortBotReadingPause;
      if (text.length <= 120) return DEMO_CONFIG.timing.mediumBotReadingPause;
      return DEMO_CONFIG.timing.longBotReadingPause;
    }

    function showLauncherRipple() {
      chatLauncher.classList.remove('show-ripple');
      void chatLauncher.offsetWidth;
      chatLauncher.classList.add('show-ripple');
      window.setTimeout(() => chatLauncher.classList.remove('show-ripple'), 600);
    }

    async function openChatWindow() {
      if (chatOpened) return;
      chatOpened = true;
      ++launcherRunId;
      chatLauncher.classList.add('is-pressed');
      showLauncherRipple();
      await wait(140);
      launcherWrap.classList.add('is-hidden');
      chatShell.setAttribute('aria-hidden', 'false');
      chatShell.classList.remove('is-closed');
      await wait(DEMO_CONFIG.timing.chatOpenDuration);
      chatLauncher.classList.remove('is-pressed');
      demoCursor.classList.remove('is-visible', 'is-pressing');
      await wait(DEMO_CONFIG.timing.conversationStartDelay);
      playConversation();
    }

    async function playInitialLauncherSequence() {
      const sequenceId = ++launcherRunId;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const touchSized = window.matchMedia('(max-width: 720px), (pointer: coarse)').matches;
      await wait(DEMO_CONFIG.timing.launcherDelay);
      if (sequenceId !== launcherRunId || chatOpened) return;

      if (reducedMotion || touchSized) {
        showLauncherRipple();
        chatLauncher.classList.add('is-pressed');
        await wait(reducedMotion ? 220 : DEMO_CONFIG.timing.mobileTapPause);
        if (sequenceId !== launcherRunId || chatOpened) return;
        await openChatWindow();
        return;
      }

      demoCursor.classList.add('is-visible');
      await wait(DEMO_CONFIG.timing.cursorRevealPause);
      if (sequenceId !== launcherRunId || chatOpened) return;
      const launcherRect = chatLauncher.getBoundingClientRect();
      const cursorRect = demoCursor.getBoundingClientRect();
      const cursorX = launcherRect.left + launcherRect.width * .58 - cursorRect.left;
      const cursorY = launcherRect.top + launcherRect.height * .58 - cursorRect.top;
      demoCursor.style.setProperty('--cursor-x', `${cursorX}px`);
      demoCursor.style.setProperty('--cursor-y', `${cursorY}px`);
      await wait(DEMO_CONFIG.timing.cursorTravel);
      if (sequenceId !== launcherRunId || chatOpened) return;
      await wait(DEMO_CONFIG.timing.cursorHoverPause);
      demoCursor.classList.add('is-pressing');
      chatLauncher.classList.add('is-pressed');
      showLauncherRipple();
      await wait(DEMO_CONFIG.timing.cursorPress);
      if (sequenceId !== launcherRunId || chatOpened) return;
      await openChatWindow();
    }

    function scrollToLatest() {
      const latestRow = messagesElement.lastElementChild;
      if (latestRow) latestRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function addBotAvatar(row) {
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = DEMO_CONFIG.botInitials;
      row.appendChild(avatar);
    }

    function addTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'message-row bot';
      row.dataset.typing = 'true';
      if (lastMessageRole === 'bot') row.classList.add('continuation');
      else addBotAvatar(row);
      row.insertAdjacentHTML('beforeend', '<div class="bubble typing" aria-label="Chatbot is typing"><i></i><i></i><i></i></div>');
      messagesElement.appendChild(row);
      scrollToLatest();
      return row;
    }

    function addMessage(item) {
      const row = document.createElement('div');
      row.className = `message-row ${item.role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const text = document.createElement('span');
      text.className = 'message-text';
      text.textContent = item.textFrom ? DEMO_CONFIG[item.textFrom] : item.text;
      bubble.appendChild(text);
      if (item.role === 'bot') {
        if (lastMessageRole === 'bot') row.classList.add('continuation');
        else addBotAvatar(row);
      }
      row.appendChild(bubble);
      messagesElement.appendChild(row);
      lastMessageRole = item.role;
      scrollToLatest();
    }

    function showChoices(item) {
      const botRow = messagesElement.lastElementChild;
      const bubble = botRow.querySelector('.bubble');
      const choiceRow = document.createElement('div');
      choiceRow.className = 'choice-row';
      const panel = document.createElement('div');
      panel.className = 'choice-panel';
      panel.setAttribute('aria-label', 'Available choices');
      item.options.forEach(optionText => {
        const option = document.createElement('div');
        option.className = 'choice-option';
        option.textContent = optionText;
        option.dataset.value = optionText;
        panel.appendChild(option);
      });
      botRow.classList.add('has-choices');
      choiceRow.appendChild(panel);
      bubble.appendChild(choiceRow);
      panel.style.maxHeight = `${panel.scrollHeight}px`;
      scrollToLatest();
      return choiceRow;
    }

    function markSelected(choiceRow, selectedValue) {
      const selectedOption = Array.from(choiceRow.querySelectorAll('.choice-option')).find(option => option.dataset.value === selectedValue);
      if (selectedOption) {
        selectedOption.classList.add('selected');
        selectedOption.setAttribute('aria-label', `${selectedValue}, selected`);
      }
    }

    async function collapseChoices(choiceRow) {
      choiceRow.querySelector('.choice-panel').classList.add('collapsing');
      await wait(DEMO_CONFIG.timing.choiceCollapse);
      choiceRow.remove();
    }

    function resetComposer() {
      composerInput.value = '';
      composerInput.blur();
      sendButton.classList.remove('active', 'sending');
    }

    async function simulateComposerEntry(item, currentRun) {
      const isOpening = item.entryMode === 'opening';
      const delays = isOpening ? DEMO_CONFIG.timing.openingCharacterDelays : DEMO_CONFIG.timing.contactCharacterDelays;
      composerInput.focus({ preventScroll: true });
      composerInput.setSelectionRange(0,0);
      for (const [index, character] of Array.from(item.text).entries()) {
        await wait(delays[index % delays.length]);
        if (currentRun !== runId) return false;
        composerInput.value += character;
        sendButton.classList.add('active');
        composerInput.setSelectionRange(composerInput.value.length,composerInput.value.length);
        if (isOpening && character === '.') await wait(DEMO_CONFIG.timing.openingSentencePause);
        if (isOpening && character === ',') await wait(DEMO_CONFIG.timing.openingClausePause);
        if (!isOpening && (index === 3 || index === 11)) await wait(DEMO_CONFIG.timing.contactGroupPause);
      }
      await wait(isOpening ? DEMO_CONFIG.timing.openingTypedPause : DEMO_CONFIG.timing.contactTypedPause);
      if (currentRun !== runId) return false;
      sendButton.classList.add('sending');
      await wait(isOpening ? DEMO_CONFIG.timing.openingSendPress : DEMO_CONFIG.timing.contactSendPress);
      if (currentRun !== runId) return false;
      resetComposer();
      addMessage({ role: 'visitor', text: item.text });
      return true;
    }

    async function playConversation() {
      const currentRun = ++runId;
      messagesElement.replaceChildren();
      messagesElement.scrollTop = 0;
      lastMessageRole = null;
      resetComposer();
      businessResult.classList.remove('visible');
      businessResult.setAttribute('aria-hidden','true');
      replayButton.disabled = true;

      await wait(DEMO_CONFIG.timing.initialSettle);
      if (currentRun !== runId) return;

      for (const item of DEMO_CONFIG.conversationSequence) {
        await wait(item.delay);
        if (currentRun !== runId) return;
        if (item.type === 'choice') {
          const choiceRow = showChoices(item);
          await wait(item.selectionDelay);
          if (currentRun !== runId) return;
          markSelected(choiceRow,item.selected);
          await wait(DEMO_CONFIG.timing.selectedHighlight);
          if (currentRun !== runId) return;
          await collapseChoices(choiceRow);
          if (currentRun !== runId) return;
          addMessage({ role: 'visitor choice', text: item.transcriptText || item.selected });
          await wait(item.afterSelection);
          if (currentRun !== runId) return;
          continue;
        }
        if (item.type === 'composer-entry') {
          if (!await simulateComposerEntry(item,currentRun)) return;
          await wait(DEMO_CONFIG.timing.visitorMessagePause);
          if (currentRun !== runId) return;
          continue;
        }
        if (item.role === 'bot') {
          const typing = addTypingIndicator();
          await wait(item.typing);
          if (currentRun !== runId) return;
          typing.remove();
        }
        addMessage(item);
        if (item.role === 'bot') {
          await wait(getBotReadingDelay(item));
          if (currentRun !== runId) return;
        }
      }

      await wait(DEMO_CONFIG.timing.resultRevealPause);
      if (currentRun !== runId) return;
      businessResult.classList.add('visible');
      businessResult.setAttribute('aria-hidden','false');
      await wait(DEMO_CONFIG.timing.resultRevealTime);
      if (currentRun === runId) {
        replayButton.disabled = false;
        scrollMobileElementIntoView(businessResult);
      }
    }

    function scrollMobileElementIntoView(element) {
      if (!window.matchMedia('(max-width: 720px)').matches) return;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.requestAnimationFrame(() => {
        element.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center', inline: 'nearest' });
      });
    }

    function replayConversation() {
      playConversation();
      scrollMobileElementIntoView(chatShell);
    }

    function scheduleInitialLauncherSequence() {
      if (initialSequenceScheduled) return;
      initialSequenceScheduled = true;

      const postImageDelay = 1200;
      const imageWaitTimeout = 5000;
      let imageReadinessResolved = false;
      let fallbackTimer = 0;

      const beginAfterImage = () => {
        if (imageReadinessResolved) return;
        imageReadinessResolved = true;
        window.clearTimeout(fallbackTimer);
        siteMockup.removeEventListener('load', beginAfterImage);
        window.setTimeout(playInitialLauncherSequence, postImageDelay);
      };

      siteMockup.addEventListener('load', beginAfterImage, { once: true });
      fallbackTimer = window.setTimeout(beginAfterImage, imageWaitTimeout);
      if (siteMockup.complete && siteMockup.naturalWidth > 0) beginAfterImage();
    }

    applyConfig();
    chatLauncher.addEventListener('click',openChatWindow);
    replayButton.addEventListener('click',replayConversation);
    contactTrigger.addEventListener('click',openContactPanel);
    contactClose.addEventListener('click',closeContactPanel);
    copyEmailButton.addEventListener('click',copyContactEmail);
    contactModal.addEventListener('click',event => { if (event.target === contactModal) closeContactPanel(); });
    document.addEventListener('keydown',event => { if (event.key === 'Escape') closeContactPanel(); });
    scheduleInitialLauncherSequence();
  </script>
</body>
</html>
