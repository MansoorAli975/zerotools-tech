  <style>
    :root {
      --brand: #167a8b;
      --brand-dark: #173f4a;
      --zero-tools-blue: #167a8b;
      --timer-track: rgba(10,58,67,.3);
      --timer-fill-start: #269eaa;
      --timer-fill-mid: #63d3d8;
      --timer-fill-end: #e2ffff;
      --timer-glow: rgba(62,205,214,.45);
      --timer-highlight: #f1ffff;
      --timer-highlight-glow: rgba(190,255,255,.66);
      --ink: #182231;
      --muted: #687486;
      --surface: #fff;
      --line: #e5e9ef;
      --page: #eef1f4;
      --shadow: 0 24px 70px rgba(22,34,53,.22);
      --launcher-right-offset: 52px;
      --mobile-launcher-right-offset: 24px;
      --launcher-bottom-offset: 116px;
      --chat-window-bottom-offset: 48px;
      --page-contact-bottom-offset: 36px;
      --mobile-launcher-bottom-offset: 110px;
      --mobile-chat-window-bottom-offset: 0px;
      --mobile-page-contact-bottom-offset: 30px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--page); }
    button, input { font: inherit; }

    .presentation {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      padding: 28px clamp(22px,5vw,76px);
      background:
        linear-gradient(90deg,rgba(246,248,250,.98) 0%,rgba(246,248,250,.88) 48%,rgba(232,236,241,.78) 100%),
        linear-gradient(135deg,#f7f8fa,#dde2e8);
    }

    .site-mockup { position: absolute; inset: 0; z-index: 0; width: 100%; height: auto; pointer-events: none; user-select: none; transition: filter 1.2s cubic-bezier(.16,1,.3,1); }
    .site-mockup.is-missing { display: none; }
    .presentation::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg,rgba(13,20,28,.04),rgba(13,20,28,.01)); }
    .focus-overlay { position: absolute; inset: 0; z-index: 1; opacity: 0; background: rgba(8,20,27,.07); transition: opacity 1.2s cubic-bezier(.16,1,.3,1); pointer-events: none; }
    body.chat-focus-mode .site-mockup { filter: blur(2.4px) brightness(.9) contrast(.94); }
    body.chat-focus-mode .focus-overlay { opacity: 1; }
    body.chat-focus-mode .chat-shell:not(.is-closed) { transform: translate(-6px,-4px) scale(1.04); box-shadow: 0 32px 86px rgba(22,34,53,.32); }
    body.chat-focus-mode .chat-shell:not(.is-closed), body.chat-focus-returning .chat-shell:not(.is-closed) { transition: transform 1.2s cubic-bezier(.16,1,.3,1),box-shadow 1.2s cubic-bezier(.16,1,.3,1); }
    body.chat-replay-refocus .site-mockup, body.chat-replay-refocus .focus-overlay, body.chat-replay-refocus .chat-shell:not(.is-closed) { transition-duration: .55s; transition-timing-function: cubic-bezier(.16,1,.3,1); }

    .concept-tools { position: fixed; z-index: 4; top: 8px; left: 50%; display: inline-flex; align-items: center; transform: translateX(-50%); }
    .concept-label { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 8px 12px; border: 1px solid rgba(255,255,255,.65); border-radius: 999px; color: #fff; background: rgba(23,63,74,.86); box-shadow: 0 7px 20px rgba(15,23,42,.2); font-size: 12px; font-weight: 800; letter-spacing: .01em; backdrop-filter: blur(8px); }
    .concept-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #7de2bc; box-shadow: 0 0 0 4px rgba(125,226,188,.17); }
    .concept-label a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.58); text-underline-offset: 2px; }
    .concept-label a:hover { text-decoration-color: currentColor; }
    .concept-label a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 2px; }

    .chat-shell { position: absolute; right: clamp(22px,5vw,76px); bottom: var(--chat-window-bottom-offset); z-index: 3; display: flex; flex-direction: column; width: min(410px,calc(100vw - 44px)); height: min(690px,calc(100svh - var(--chat-window-bottom-offset) - 24px)); min-height: 510px; overflow: hidden; opacity: 1; transform: scale(1); transform-origin: right bottom; visibility: visible; border: 1px solid rgba(255,255,255,.72); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); transition: opacity .62s ease,transform .62s cubic-bezier(.2,.8,.2,1),visibility 0s linear 0s; }
    .chat-shell.is-closed { pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(28px) scale(.86); transition: opacity .28s ease,transform .28s ease,visibility 0s linear .28s; }

    .launcher-wrap { position: fixed; right: var(--launcher-right-offset); bottom: var(--launcher-bottom-offset); z-index: 6; display: flex; align-items: center; gap: 10px; opacity: 1; transition: opacity .24s ease,transform .24s ease,visibility 0s linear 0s; }
    .launcher-wrap.is-hidden { pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(8px) scale(.92); transition-delay: 0s,0s,.24s; }
    .launcher-tooltip { display: none; padding: 7px 10px; border: 1px solid rgba(255,255,255,.72); border-radius: 9px; color: #fff; background: color-mix(in srgb,var(--brand-dark) 92%,transparent); box-shadow: 0 7px 20px rgba(5,11,25,.22); font-size: 11px; font-weight: 750; white-space: nowrap; }
    .chat-launcher { position: relative; display: grid; width: 64px; height: 64px; place-items: center; overflow: visible; border: 2px solid rgba(255,255,255,.88); border-radius: 50%; color: #fff; background: linear-gradient(145deg,var(--brand),var(--brand-dark)); box-shadow: 0 12px 28px rgba(5,11,25,.34); cursor: pointer; animation: none; transition: transform .16s ease,box-shadow .16s ease; }
    .chat-launcher:hover, .chat-launcher.is-script-hover { transform: translateY(-2px); box-shadow: 0 15px 32px rgba(5,11,25,.4); }
    .chat-launcher:focus-visible { outline: 3px solid color-mix(in srgb,var(--brand) 55%,white); outline-offset: 4px; }
    .chat-launcher.is-pressed { transform: scale(.9); box-shadow: 0 6px 14px rgba(5,11,25,.32); }
    .launcher-icon { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .launcher-id { position: absolute; right: -4px; bottom: -2px; display: grid; min-width: 27px; height: 20px; padding: 0 5px; place-items: center; border: 2px solid #fff; border-radius: 999px; color: #fff; background: var(--brand); font-size: 8px; font-weight: 900; letter-spacing: .03em; }
    .launcher-ripple { position: absolute; inset: 50%; width: 20px; height: 20px; pointer-events: none; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; opacity: 0; transform: translate(-50%,-50%) scale(.4); }
    .chat-launcher.show-ripple .launcher-ripple { animation: launcher-ripple .55s ease-out; }
    .page-contact-widget { position: fixed; right: var(--launcher-right-offset); bottom: var(--page-contact-bottom-offset); z-index: 5; display: grid; width: 64px; height: 64px; place-items: center; pointer-events: none; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; color: #fff; background: #08a640; box-shadow: 0 8px 18px rgba(5,65,30,.24); }
    .page-contact-widget svg { display: block; width: 34px; height: 34px; fill: #fff; color: #fff; stroke: none; }
    .presentation:has(.chat-shell:not(.is-closed)) .page-contact-widget { display: none; }

    .demo-cursor { --cursor-x: 0px; --cursor-y: 0px; position: fixed; right: 18px; bottom: 30px; z-index: 8; width: 27px; height: 34px; pointer-events: none; visibility: hidden; opacity: 0; transform: translate(var(--cursor-x),var(--cursor-y)); transition: transform 1.08s cubic-bezier(.2,.76,.25,1),opacity .18s ease; filter: drop-shadow(0 2px 2px rgba(0,0,0,.28)); }
    .demo-cursor.is-visible { visibility: visible; opacity: 1; }
    .demo-cursor.is-pressing { transform: translate(var(--cursor-x),var(--cursor-y)) scale(.88); }
    .demo-cursor svg { width: 100%; height: 100%; fill: #fff; stroke: #111827; stroke-width: 1.25; stroke-linejoin: round; }
    .chat-header { display: flex; flex: 0 0 auto; align-items: center; gap: 9px; min-height: 76px; padding: 14px 12px 14px 15px; color: #fff; background: linear-gradient(135deg,var(--brand-dark),var(--brand)); }
    .avatar, .message-avatar { display: grid; flex: 0 0 auto; place-items: center; border-radius: 50%; color: #fff; background: rgba(255,255,255,.16); font-weight: 900; }
    .avatar { width: 45px; height: 45px; border: 1px solid rgba(255,255,255,.35); font-size: 14px; }
    .chat-title { min-width: 0; flex: 1; }
    .chat-title strong { display: block; overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .chat-title span { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; opacity: .88; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7de2bc; box-shadow: 0 0 0 3px rgba(125,226,188,.15); }
    .playback-controls { display: flex; flex: 0 0 auto; gap: 5px; }
    .playback-control { min-height: 32px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.27); border-radius: 9px; color: rgba(255,255,255,.9); background: rgba(255,255,255,.08); font-size: 10px; font-weight: 800; cursor: pointer; transition: .18s ease; }
    .playback-speed { width: 46px; flex: 0 0 46px; padding: 3px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
    .playback-speed-label { font-size: 8px; font-weight: 600; }
    .playback-speed-value { font-size: 10px; font-weight: 800; }
    .playback-control:hover { border-color: rgba(255,255,255,.42); color: #fff; background: rgba(255,255,255,.14); }
    .playback-control:active { transform: scale(.97); }
    .playback-control:focus-visible { outline: 3px solid color-mix(in srgb,var(--brand) 40%,transparent); outline-offset: 2px; }
    .playback-control:disabled { cursor: not-allowed; opacity: .45; }
    body.demo-paused .typing i { animation-play-state: paused; }
    .playback-timer { position: relative; z-index: 4; display: flex; width: 100%; height: 6px; align-items: center; overflow: hidden; background: var(--timer-track); }
    .playback-timer-fill { position: relative; width: 100%; height: 4px; border-radius: 0 999px 999px 0; background: linear-gradient(90deg,var(--timer-fill-start) 0%,var(--timer-fill-mid) 70%,var(--timer-fill-end) 100%); box-shadow: 0 0 5px var(--timer-glow),0 0 2px rgba(255,255,255,.48); transform: scaleX(0); transform-origin: left center; will-change: transform; }
    .playback-timer-fill::after { content: ""; position: absolute; top: 50%; right: 0; width: 6px; height: 4px; border-radius: 999px; background: var(--timer-highlight); box-shadow: 0 0 5px var(--timer-highlight-glow),0 0 2px rgba(255,255,255,.7); transform: translateY(-50%); }

    .messages { min-height: 0; flex: 1 1 auto; overflow-y: auto; padding: 18px 16px 24px; background: linear-gradient(180deg,#fbfcfd,#f7f8fa); scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: rgba(122,132,144,.22) transparent; }
    .messages::-webkit-scrollbar { width: 2px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(122,132,144,.22); }
    .messages::-webkit-scrollbar-thumb:hover { background: rgba(122,132,144,.38); }

    .composer-area { flex: 0 0 auto; padding: 8px 11px 6px; border-top: 1px solid #ddd8d3; background: #f8f7f5; }
    .composer { display: flex; align-items: center; gap: 7px; min-height: 46px; padding: 6px 7px 6px 10px; border: 1px solid #d7dce2; border-radius: 15px; background: #fff; box-shadow: 0 2px 7px rgba(33,43,54,.04); transition: border-color .18s ease,box-shadow .18s ease; }
    .composer-input { min-width: 0; height: 34px; flex: 1; padding: 0 3px; border: 0; outline: 0; color: #3d4754; background: transparent; font-size: 12.5px; caret-color: var(--brand); }
    .composer-input::placeholder { color: #929ba8; }
    .composer:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb,var(--brand) 10%,transparent); }
    .composer-icon { display: grid; width: 20px; height: 20px; flex: 0 0 auto; place-items: center; color: #86919f; }
    .composer-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .send-button { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 10px; color: #9ba4af; background: #eef0f2; pointer-events: none; transition: color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease; }
    .send-button svg { width: 16px; height: 16px; fill: currentColor; transform: translateX(1px); }
    .send-button.active, .send-button.sending { color: #fff; background: var(--brand); box-shadow: 0 2px 7px color-mix(in srgb,var(--brand) 24%,transparent); }
    .send-button.sending { transform: scale(.9); }
    .powered-by { margin: 5px 0 0; color: #8a939e; font-size: 9px; font-weight: 700; text-align: center; }

    .message-row { display: flex; margin: 0 0 12px; opacity: 0; transform: translateY(8px); animation: message-in .34s ease forwards; }
    .message-row.bot { align-items: flex-end; gap: 8px; }
    .message-row.bot.continuation { padding-left: 36px; }
    .message-row.visitor { justify-content: flex-end; }
    .message-avatar { width: 28px; height: 28px; border: 1px solid color-mix(in srgb,var(--brand) 25%,transparent); color: var(--brand-dark); background: color-mix(in srgb,var(--brand) 10%,white); font-size: 9px; }
    .bubble { max-width: 84%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 15px 15px 15px 5px; color: #303b49; background: #fff; box-shadow: 0 3px 10px rgba(33,43,54,.05); font-size: 12.5px; line-height: 1.52; white-space: pre-line; }
    .visitor .bubble { border-color: var(--brand); border-radius: 15px 15px 5px 15px; color: #fff; background: var(--brand); }
    .message-row.bot.has-choices .bubble { width: min(92%,320px); max-width: 92%; }
    .message-text { display: block; }

    .choice-row { overflow: hidden; margin-top: 10px; }
    .choice-panel { display: grid; gap: 7px; max-height: 280px; overflow: hidden; transform-origin: top; transition: max-height .3s ease,margin .3s ease,padding .3s ease,opacity .22s ease,transform .3s ease; }
    .choice-panel.collapsing { max-height: 0 !important; margin: 0; padding: 0; opacity: 0; transform: scaleY(.92); }
    .choice-option { padding: 9px 10px; border: 1px solid color-mix(in srgb,var(--brand) 30%,#d8dee5); border-radius: 10px; color: var(--brand-dark); background: color-mix(in srgb,var(--brand) 5%,white); font-size: 11.5px; font-weight: 750; transition: color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease; }
    .choice-option.selected { border-color: var(--brand); color: #fff; background: var(--brand); transform: translateX(2px); }

    .business-result { position: absolute; top: 50%; left: clamp(22px,calc(42vw - 215px),calc(100vw - clamp(22px,5vw,76px) - min(410px,calc(100vw - 44px)) - clamp(18px,2vw,32px) - min(430px,calc(100vw - 490px)))); z-index: 3; width: min(430px,calc(100vw - 490px)); max-height: calc(100svh - 120px); overflow: auto; visibility: hidden; border: 1px solid rgba(255,255,255,.74); border-radius: 20px; opacity: 0; background: rgba(255,255,255,.96); box-shadow: 0 14px 38px rgba(22,34,53,.12); transform: translate(min(380px,28vw),calc(-50% + 10px)) scale(.92) rotate(.55deg); transform-origin: right center; transition: opacity .34s ease,transform .6s cubic-bezier(.22,.78,.24,1),box-shadow .6s ease,visibility 0s linear .6s; backdrop-filter: blur(10px); anchor-name: --result-card; }
    .business-result.visible { visibility: visible; opacity: 1; box-shadow: var(--shadow); transform: translate(0,-50%) scale(1) rotate(0); transition-delay: 0s; }
    .summary-heading { position: relative; padding: 20px 118px 16px 22px; border-bottom: 1px solid #e6e9ed; color: var(--ink); font-size: 18px; font-weight: 900; }

    .summary-heading::before { content: "✓"; display: inline-grid; width: 22px; height: 22px; margin-right: 8px; place-items: center; border-radius: 50%; color: #fff; background: var(--brand); font-size: 12px; vertical-align: 2px; }

    .summary-list { margin: 0; padding: 7px 22px 13px; }

    .summary-item:last-child { border-bottom: 0; }
    .summary-item dt { color: var(--muted); }
    .summary-item dd { margin: 0; color: var(--ink); font-weight: 700; text-align: left; }
    .result-cta { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 22px 15px; border-top: 1px solid #e6e9ed; opacity: 0; background: rgba(247,249,252,.9); transform: translateY(5px); transition: opacity .24s ease .52s,transform .24s ease .52s; }

    .result-cta p { margin: 0; color: #465365; font-size: 11.5px; font-weight: 700; line-height: 1.35; }
    .contact-trigger { flex: 0 0 auto; padding: 8px 11px; border: 0; border-radius: 9px; color: #fff; background: #172b4d; font-size: 11px; font-weight: 800; cursor: pointer; }
    .contact-trigger:hover { background: #223d68; }
    .result-minimize { position: absolute; top: 13px; right: 13px; padding: 7px 9px; border: 1px solid #d5dce5; border-radius: 8px; color: #40516a; background: #f5f7fa; font-size: 10px; font-weight: 850; cursor: pointer; }
    .result-demo-controls { position: fixed; position-anchor: --result-card; z-index: 9; top: calc(anchor(top) + 14px); left: calc(anchor(right) - 92px); bottom: auto; display: flex; max-width: calc(100vw - 44px); gap: 8px; flex-wrap: wrap; transform: translateX(-100%); }
    .result-demo-controls.is-minimized { position-anchor: auto; top: auto; left: clamp(22px,5vw,76px); bottom: 76px; padding: 6px; border: 1px solid rgba(23,43,77,.14); border-radius: 13px; background: rgba(255,255,255,.94); box-shadow: 0 8px 24px rgba(6,18,38,.16); transform: none; backdrop-filter: blur(8px); }

      DEMO_CONFIG.conversationSequence.forEach((item, itemIndex) => {
        total += item.delay || 0;
        if (item.type === 'choice') {
          total += item.selectionDelay + t.selectedHighlight + t.choiceCollapse + item.afterSelection;
        } else if (item.type === 'composer-entry') {
          const opening = item.entryMode === 'opening';
          const delays = opening ? t.openingCharacterDelays : t.contactCharacterDelays;
          Array.from(item.text).forEach((character, index) => {
            total += delays[index % delays.length];
            if (opening && character === '.') total += t.openingSentencePause;
            if (opening && character === ',') total += t.openingClausePause;
            if (!opening && (index === 3 || index === 11)) total += t.contactGroupPause;

          total += (opening ? t.openingTypedPause + t.openingSendPress : t.contactTypedPause + t.contactSendPress) + t.visitorMessagePause;
        } else if (item.role === 'bot') {
          total += item.typing;
          if (itemIndex !== DEMO_CONFIG.conversationSequence.length - 1) total += getBotReadingDelay(item);
        }
      });
      return total;
    }

    async function wait(milliseconds, baseMilliseconds = milliseconds) {
      const progressRate = milliseconds > 0 ? baseMilliseconds / milliseconds : 1;
      const countsForProgress = progressTimerRunning;
      let remaining = milliseconds;
      const generation = delayGeneration;
      while (remaining > 0) {
        if (generation !== delayGeneration) return;
        await waitUntilResumed();
        if (generation !== delayGeneration) return;
        const elapsed = await new Promise(resolve => {
          const started = performance.now();
          const timer = window.setTimeout(() => {
            activeDelay = null;
            resolve(remaining);
          }, remaining);
          activeDelay = { timer, started, remaining, resolve, progressRate: countsForProgress ? progressRate : 0 };
        });
        if (generation !== delayGeneration) return;
        if (countsForProgress && progressTimerRunning) progressElapsed = Math.min(progressDuration, progressElapsed + elapsed * progressRate);
        remaining = Math.max(0, remaining - elapsed);
      }
    }

    function renderProgress(value) {
      const clampedProgress = Math.max(0, Math.min(1, value));
      displayedProgress = clampedProgress;
      progressFill.style.transform = `scaleX(${clampedProgress})`;
    }

    function animateProgress() {
      if (!progressTimerRunning) return;
      if (playbackPaused) {
        progressAnimationFrame = window.requestAnimationFrame(animateProgress);
        return;
      }
      const activeWork = !playbackPaused && activeDelay
        ? Math.min(activeDelay.remaining, Math.max(0, performance.now() - activeDelay.started)) * activeDelay.progressRate
        : 0;
      const ratio = progressDuration > 0 ? Math.min(.999999, (progressElapsed + activeWork) / progressDuration) : 0;
      // Only completeProgressTimer marks 100%, immediately after the final bot insertion.
      renderProgress(Math.max(displayedProgress, progressStartValue + (1 - progressStartValue) * ratio));
      progressAnimationFrame = window.requestAnimationFrame(animateProgress);
    }

    function startProgressTimer(duration, startValue = 0) {
      if (progressAnimationFrame) window.cancelAnimationFrame(progressAnimationFrame);
      progressAnimationFrame = 0;
      progressStartValue = Math.max(0, Math.min(1, startValue));
      progressDuration = Math.max(0, duration);
      progressLastTimestamp = 0;
      progressElapsed = 0;
      progressTimerRunning = progressDuration > 0 && progressStartValue < 1;
      renderProgress(progressStartValue);
      if (!progressTimerRunning) return;
      progressAnimationFrame = window.requestAnimationFrame(animateProgress);
    }

    function resetProgressTimer() {
      if (progressAnimationFrame) window.cancelAnimationFrame(progressAnimationFrame);

      progressStartValue = 0;

      progressLastTimestamp = 0;

    async function playInitialLauncherSequence() {

      await wait(DEMO_CONFIG.timing.launcherDelay);
      if (sequenceId !== launcherRunId || chatOpened) return;

      if (!reducedMotion) {
        launcherWrap.classList.add('show-attention');
        trackDemoEvent('launcher_attention_shown');
        await wait(850);
        launcherWrap.classList.remove('show-attention');
        if (sequenceId !== launcherRunId || chatOpened) return;
      }

      if (reducedMotion || touchSized) {
        showLauncherRipple();
        chatLauncher.classList.add('is-pressed');
        await wait(reducedMotion ? 220 : DEMO_CONFIG.timing.mobileTapPause);
        if (sequenceId !== launcherRunId || chatOpened) return;
        await openChatWindow();
        return;
      }

      demoCursor.classList.add('is-visible');
      await wait(DEMO_CONFIG.timing.cursorRevealPause);
      if (sequenceId !== launcherRunId || chatOpened) return;
      const launcherRect = chatLauncher.getBoundingClientRect();
      const cursorRect = demoCursor.getBoundingClientRect();
      const cursorX = launcherRect.left + launcherRect.width * .58 - cursorRect.left;
      const cursorY = launcherRect.top + launcherRect.height * .58 - cursorRect.top;
      demoCursor.style.setProperty('--cursor-x', `${cursorX}px`);
      demoCursor.style.setProperty('--cursor-y', `${cursorY}px`);
      await wait(DEMO_CONFIG.timing.cursorTravel);
      if (sequenceId !== launcherRunId || chatOpened) return;
      chatLauncher.classList.add('is-script-hover');
      await wait(DEMO_CONFIG.timing.cursorHoverPause);
      demoCursor.classList.add('is-pressing');
      chatLauncher.classList.add('is-pressed');
      showLauncherRipple();
      await wait(DEMO_CONFIG.timing.cursorPress);
      if (sequenceId !== launcherRunId || chatOpened) return;
      await openChatWindow();
    }

      resultDiscussMinimizedButton.hidden = true;
      resultRestoreButton.hidden = true;
      resultMinimizeButton.setAttribute('aria-expanded', 'true');
      resultDemoControls.hidden = true;
    }

    function showResultPresentation() {
      businessResult.classList.remove('is-minimized');
      businessResult.classList.add('visible');
      businessResult.setAttribute('aria-hidden', 'false');
      resultDemoControls.classList.remove('is-minimized');
      resultDiscussMinimizedButton.hidden = true;
      resultRestoreButton.hidden = true;
      resultMinimizeButton.setAttribute('aria-expanded', 'true');
      resultDemoControls.hidden = false;
    }

    function setResultMinimized(minimized) {
      businessResult.classList.toggle('is-minimized', minimized);
      businessResult.setAttribute('aria-hidden', String(minimized));
      resultDemoControls.classList.toggle('is-minimized', minimized);
      resultDiscussMinimizedButton.hidden = !minimized;
      resultRestoreButton.hidden = !minimized;
      resultDemoControls.hidden = false;
      resultMinimizeButton.setAttribute('aria-expanded', String(!minimized));
    }

    function toggleResultMinimized() {
      setResultMinimized(!businessResult.classList.contains('is-minimized'));
    }

    function restoreNaturalSiteState() {
      document.body.classList.remove('chat-focus-mode', 'chat-focus-returning', 'chat-replay-refocus');
      closeChatAndRestoreLauncher();
    }

    function closeChatAndRestoreLauncher() {
      chatShell.classList.add('is-closed');
      chatShell.setAttribute('aria-hidden', 'true');
      launcherWrap.classList.remove('is-hidden', 'show-attention');
      chatLauncher.classList.remove('is-script-hover', 'is-pressed', 'show-ripple');
      demoCursor.classList.remove('is-visible', 'is-pressing');
      demoCursor.style.setProperty('--cursor-x', '0px');
      demoCursor.style.setProperty('--cursor-y', '0px');
      chatOpened = false;
    }

    function scrollToLatest() {
      const latestRow = messagesElement.lastElementChild;
      if (latestRow) latestRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function addBotAvatar(row) {
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = DEMO_CONFIG.botInitials;
      row.appendChild(avatar);
    }

    function addTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'message-row bot';
      row.dataset.typing = 'true';
      if (lastMessageRole === 'bot') row.classList.add('continuation');
      else addBotAvatar(row);
      row.insertAdjacentHTML('beforeend', '<div class="bubble typing" aria-label="Chatbot is typing"><i></i><i></i><i></i></div>');
      messagesElement.appendChild(row);
      scrollToLatest();
      return row;
    }

    function addMessage(item) {
      const row = document.createElement('div');
      row.className = `message-row ${item.role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const text = document.createElement('span');
      text.className = 'message-text';
      text.textContent = item.textFrom ? DEMO_CONFIG[item.textFrom] : item.text;
      bubble.appendChild(text);
      if (item.role === 'bot') {
        if (lastMessageRole === 'bot') row.classList.add('continuation');
        else addBotAvatar(row);
      }
      row.appendChild(bubble);
      messagesElement.appendChild(row);
      lastMessageRole = item.role;
      scrollToLatest();
    }

    function showChoices(item) {
      const botRow = messagesElement.lastElementChild;
      const bubble = botRow.querySelector('.bubble');
      const choiceRow = document.createElement('div');
      choiceRow.className = 'choice-row';
      const panel = document.createElement('div');
      panel.className = 'choice-panel';
      panel.setAttribute('aria-label', 'Available choices');
      item.options.forEach(optionText => {
        const option = document.createElement('div');
        option.className = 'choice-option';
        option.textContent = optionText;
        option.dataset.value = optionText;
        panel.appendChild(option);
      });
      botRow.classList.add('has-choices');
      choiceRow.appendChild(panel);
      bubble.appendChild(choiceRow);
      panel.style.maxHeight = `${panel.scrollHeight}px`;
      scrollToLatest();
      return choiceRow;
    }

    function markSelected(choiceRow, selectedValue) {
      const selectedOption = Array.from(choiceRow.querySelectorAll('.choice-option')).find(option => option.dataset.value === selectedValue);
      if (selectedOption) {
        selectedOption.classList.add('selected');
        selectedOption.setAttribute('aria-label', `${selectedValue}, selected`);
      }
    }

    async function collapseChoices(choiceRow) {
      choiceRow.querySelector('.choice-panel').classList.add('collapsing');
      await wait(DEMO_CONFIG.timing.choiceCollapse);
      choiceRow.remove();
    }

    function resetComposer() {
      composerInput.value = '';
      composerInput.blur();
      sendButton.classList.remove('active', 'sending');
    }

    async function simulateComposerEntry(item, currentRun) {
      const isOpening = item.entryMode === 'opening';
      const delays = isOpening ? DEMO_CONFIG.timing.openingCharacterDelays : DEMO_CONFIG.timing.contactCharacterDelays;
      composerInput.focus({ preventScroll: true });
      composerInput.setSelectionRange(0,0);
      for (const [index, character] of Array.from(item.text).entries()) {
        await wait(delays[index % delays.length]);
        if (currentRun !== runId) return false;
        composerInput.value += character;
        if (!cameraNoticeStarted) {
          cameraNoticeStarted = true;
          cameraNoticeElapsed = 0;
        } else if (!cameraFocusStarted) {
          cameraNoticeElapsed += delays[index % delays.length];
        }
        if (!cameraFocusStarted && cameraNoticeElapsed >= 800) {
          cameraFocusStarted = true;
          document.body.classList.remove('chat-focus-returning');
          document.body.classList.add('chat-focus-mode');
          trackDemoEvent('camera_focus_started', { noticeDelay: cameraNoticeElapsed });
        }
        sendButton.classList.add('active');
        composerInput.setSelectionRange(composerInput.value.length,composerInput.value.length);
        if (isOpening && character === '.') await wait(DEMO_CONFIG.timing.openingSentencePause);
        if (isOpening && character === ',') await wait(DEMO_CONFIG.timing.openingClausePause);
        if (!isOpening && (index === 3 || index === 11)) await wait(DEMO_CONFIG.timing.contactGroupPause);
      }
      await waitScaled(isOpening ? DEMO_CONFIG.timing.openingTypedPause : DEMO_CONFIG.timing.contactTypedPause);
      if (currentRun !== runId) return false;
      sendButton.classList.add('sending');
      await wait(isOpening ? DEMO_CONFIG.timing.openingSendPress : DEMO_CONFIG.timing.contactSendPress);
      if (currentRun !== runId) return false;
      resetComposer();
      addMessage({ role: 'visitor', text: item.text });
      return true;
    }

    async function playConversation({ replayPlayback = false } = {}) {
      const currentRun = ++runId;
      isReplayPlayback = replayPlayback;
      cameraFocusStarted = replayPlayback;
      cameraNoticeStarted = replayPlayback;
      cameraNoticeElapsed = replayPlayback ? 800 : 0;
      manualPause = false;
      playbackSkipped = false;
      playbackActive = true;
      updatePauseControl();
      if (replayPlayback) {
        document.body.classList.remove('chat-focus-returning');
        document.body.classList.add('chat-focus-mode');
      } else {
        document.body.classList.remove('chat-focus-mode', 'chat-focus-returning');
      }
      messagesElement.replaceChildren();
      messagesElement.scrollTop = 0;
      lastMessageRole = null;
      resetComposer();
      hideResultPresentation();
      replayButton.disabled = false;
      pauseResumeButton.disabled = false;
      skipResultButton.disabled = false;
      startProgressTimer(getConversationBaseDuration());
      trackDemoEvent('demo_started');

      await wait(DEMO_CONFIG.timing.initialSettle);
      if (currentRun !== runId) return;

      for (const [itemIndex, item] of DEMO_CONFIG.conversationSequence.entries()) {
        await waitScaled(item.delay);
        if (currentRun !== runId) return;
        if (item.type === 'choice') {
          const choiceRow = showChoices(item);
          await waitScaled(item.selectionDelay);
          if (currentRun !== runId) return;
          markSelected(choiceRow,item.selected);
          await wait(DEMO_CONFIG.timing.selectedHighlight);
          if (currentRun !== runId) return;
          await collapseChoices(choiceRow);
          if (currentRun !== runId) return;
          addMessage({ role: 'visitor choice', text: item.transcriptText || item.selected });
          await waitScaled(item.afterSelection);
          if (currentRun !== runId) return;
          continue;
        }
        if (item.type === 'composer-entry') {
          if (!await simulateComposerEntry(item,currentRun)) return;
          await waitScaled(DEMO_CONFIG.timing.visitorMessagePause);
          if (currentRun !== runId) return;
          continue;
        }
        if (item.role === 'bot') {
          const typing = addTypingIndicator();
          await wait(item.typing);
          if (currentRun !== runId) return;
          typing.remove();
        }
        addMessage(item);
        const isFinalBotMessage = itemIndex === DEMO_CONFIG.conversationSequence.length - 1 && item.role === 'bot';
        if (isFinalBotMessage) completeProgressTimer();
        if (item.role === 'bot') {
          // Keep the post-conversation reading hold at its existing displayed-speed rate.
          await waitScaled(isFinalBotMessage ? DEMO_CONFIG.timing.finalMessageHold : getBotReadingDelay(item), !isFinalBotMessage);
          if (currentRun !== runId) return;
        }
      }

      closeChatAndRestoreLauncher();
      await wait(DEMO_CONFIG.timing.chatCloseSettle);
      if (currentRun !== runId) return;
      restoreNaturalSiteState();
      const siteRestoreDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : DEMO_CONFIG.timing.siteRestoreDuration;
      await wait(siteRestoreDuration);
      if (currentRun !== runId) return;
      await wait(DEMO_CONFIG.timing.cleanSiteRevealHold);
      if (currentRun !== runId) return;
      showResultPresentation();
      await wait(DEMO_CONFIG.timing.resultRevealTime);
      if (currentRun === runId) {
        playbackActive = false;
        pauseResumeButton.disabled = true;
        skipResultButton.disabled = true;
        replayButton.disabled = false;
        scrollMobileElementIntoView(businessResult);
        trackDemoEvent('demo_completed');
        trackDemoEvent('result_shown');
      }
    }

    function scrollMobileElementIntoView(element) {
      if (!window.matchMedia('(max-width: 720px)').matches) return;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.requestAnimationFrame(() => {
        element.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center', inline: 'nearest' });
      });
    }

    function toggleManualPause() {
      if (!playbackActive) return;
      if (manualPause) {
        manualPause = false;
        updatePauseControl();
        scrollToLatest();
        trackDemoEvent('demo_resumed_manual');
      } else {
        manualPause = true;
        updatePauseControl();
        trackDemoEvent('demo_paused_manual');
      }
    }

    async function skipToResult() {
      if (!playbackActive) return;
      trackDemoEvent('skip_to_result');
      playbackSkipped = true;
      playbackActive = false;
      const skipRunId = ++runId;
      ++launcherRunId;
      manualPause = false;
      visibilityPause = false;
      updatePauseControl();
      cancelPendingDelay();
      resetComposer();
      messagesElement.querySelectorAll('[data-typing="true"], .choice-row').forEach(element => element.remove());
      completeProgressTimer();
      pauseResumeButton.disabled = true;
      skipResultButton.disabled = true;
      closeChatAndRestoreLauncher();
      await wait(DEMO_CONFIG.timing.chatCloseSettle);
      if (skipRunId !== runId) return;
      restoreNaturalSiteState();
      const siteRestoreDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : DEMO_CONFIG.timing.siteRestoreDuration;
      await wait(siteRestoreDuration);
      if (skipRunId !== runId) return;
      await wait(DEMO_CONFIG.timing.skipCleanSiteRevealHold);
      if (skipRunId !== runId) return;
      showResultPresentation();
      replayButton.disabled = false;
      scrollMobileElementIntoView(businessResult);
      trackDemoEvent('demo_completed', { skipped: true });
      trackDemoEvent('result_shown', { skipped: true });
    }

    async function replayConversation() {
      trackDemoEvent('replay_clicked');
      const wasFocused = document.body.classList.contains('chat-focus-mode');
      isReplayPlayback = true;
      ++runId;
      cancelPendingDelay();
      manualPause = false;
      visibilityPause = false;
      playbackPaused = false;
      playbackActive = false;
      playbackSkipped = false;
      resumeWaiters.splice(0).forEach(resolve => resolve());
      document.body.classList.remove('demo-paused');
      pauseResumeButton.textContent = 'Pause';
      pauseResumeButton.setAttribute('aria-label','Pause demo');
      replayButton.disabled = true;
      pauseResumeButton.disabled = true;
      skipResultButton.disabled = true;
      messagesElement.replaceChildren();
      messagesElement.scrollTop = 0;
      lastMessageRole = null;
      resetComposer();
      resetProgressTimer();
      businessResult.classList.remove('visible');
      businessResult.setAttribute('aria-hidden','true');
      if (!wasFocused) {
        document.body.classList.remove('chat-focus-returning');
        document.body.classList.add('chat-replay-refocus');
        void siteMockup.offsetWidth;
        document.body.classList.add('chat-focus-mode');
        const replayRefocusDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 550;
        if (replayRefocusDelay) await wait(replayRefocusDelay);
        document.body.classList.remove('chat-replay-refocus');
      }
      playConversation({ replayPlayback: true });
      scrollMobileElementIntoView(chatShell);
    }

    async function replayFullDemo() {
      ++runId;
      ++launcherRunId;
      cancelPendingDelay();
      manualPause = false;
      visibilityPause = false;
      playbackPaused = false;
      playbackActive = false;
      playbackSkipped = false;
      isReplayPlayback = false;
      cameraFocusStarted = false;
      cameraNoticeStarted = false;
      cameraNoticeElapsed = 0;
      resumeWaiters.splice(0).forEach(resolve => resolve());
      document.body.classList.remove('demo-paused');
      pauseResumeButton.textContent = 'Pause';
      pauseResumeButton.setAttribute('aria-label', 'Pause demo');
      replayButton.disabled = false;
      pauseResumeButton.disabled = true;
      skipResultButton.disabled = true;
      hideResultPresentation();
      contactModal.classList.remove('is-open');
      contactModal.setAttribute('aria-hidden', 'true');
      restoreNaturalSiteState();
      messagesElement.replaceChildren();
      messagesElement.scrollTop = 0;
      lastMessageRole = null;
      resetComposer();
      resetProgressTimer();
      await waitForPaintFrames(2);
      playInitialLauncherSequence();
    }

    async function waitForPaintFrames(count = 2) {
      for (let frame = 0; frame < count; frame += 1) {
        await new Promise(resolve => window.requestAnimationFrame(resolve));
      }
    }

    function waitForSiteMockupState() {
      return new Promise(resolve => {
        let resolved = false;
        const finish = loaded => {
          if (resolved) return;
          resolved = true;
          siteMockup.removeEventListener('load', handleLoad);
          siteMockup.removeEventListener('error', handleError);
          resolve(loaded);
        };
        const handleLoad = () => finish(siteMockup.naturalWidth > 0);
        const handleError = () => finish(false);
        siteMockup.addEventListener('load', handleLoad);
        siteMockup.addEventListener('error', handleError);
        if (siteMockup.complete) finish(siteMockup.naturalWidth > 0);
      });
    }

    async function scheduleInitialLauncherSequence() {
      if (initialSequenceScheduled) return;
      initialSequenceScheduled = true;
      const postImageDelay = 400;
      let imageLoaded = await waitForSiteMockupState();

      if (imageLoaded && typeof siteMockup.decode === 'function') {
        try {
          await siteMockup.decode();
        } catch {
          imageLoaded = siteMockup.complete && siteMockup.naturalWidth > 0;
        }
      }

      if (!imageLoaded) siteMockup.classList.add('is-missing');
      await waitForPaintFrames(2);
      window.setTimeout(playInitialLauncherSequence, postImageDelay);
    }

    applyConfig();
    trackDemoEvent('page_view');
    chatLauncher.addEventListener('click',openChatWindow);
    replayButton.addEventListener('click',hideResultPresentation);
    replayButton.addEventListener('click',replayConversation);
    replayDemoButton.addEventListener('click',() => { trackDemoEvent('replay_clicked'); replayFullDemo(); });
    resultMinimizeButton.addEventListener('click',toggleResultMinimized);
    resultRestoreButton.addEventListener('click',() => setResultMinimized(false));
    pauseResumeButton.addEventListener('click',toggleManualPause);
    skipResultButton.addEventListener('click',skipToResult);
    speedButton.addEventListener('click',cyclePlaybackSpeed);
    contactTrigger.addEventListener('click',() => { trackDemoEvent('cta_clicked'); openContactPanel(); });
    resultDiscussMinimizedButton.addEventListener('click',() => { trackDemoEvent('cta_clicked'); openContactPanel(); });
    contactClose.addEventListener('click',closeContactPanel);
    copyEmailButton.addEventListener('click',copyContactEmail);
    contactModal.addEventListener('click',event => { if (event.target === contactModal) closeContactPanel(); });
    document.addEventListener('keydown',event => { if (event.key === 'Escape') closeContactPanel(); });
    document.addEventListener('visibilitychange',() => {
      if (!playbackActive) return;
      if (document.hidden && !manualPause) {
        visibilityPause = true;
        updatePauseControl();
        trackDemoEvent('demo_paused_visibility');
      } else if (!document.hidden && visibilityPause) {
        visibilityPause = false;
        updatePauseControl();
        trackDemoEvent('demo_resumed_visibility');
      }
    });
    scheduleInitialLauncherSequence();
  </script>
</body>
</html>
