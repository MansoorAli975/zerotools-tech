<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>UChat Custom Launcher Proof</title>
  <style>
    body {
      margin: 0;
      padding: 48px;
      font-family: Arial, sans-serif;
      color: #17211b;
      background: #f4f7f5;
    }

    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: #14532d;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>UChat Custom Launcher Proof</h1>
  <button id="open-uchat" type="button" disabled>Open real UChat</button>
  <button id="close-uchat" type="button" disabled>Close UChat</button>
  <p id="status">Waiting for UChat...</p>
  <p id="bubble-status" hidden>Native UChat bubble suppression active</p>

  <script>
    const openButton = document.getElementById('open-uchat');
    const closeButton = document.getElementById('close-uchat');
    const status = document.getElementById('status');
    const bubbleStatus = document.getElementById('bubble-status');
    let nativeBubbleShouldBeHidden = false;

    window.addEventListener('chatbot:ready', function () {
      console.log('chatbot:ready');
      nativeBubbleShouldBeHidden = true;
      window.$chatbot.toggleBubbleVisibility('hide');

      openButton.disabled = false;
      closeButton.disabled = false;
      bubbleStatus.hidden = false;
      status.textContent = 'UChat ready — custom launcher enabled';
    });

    openButton.addEventListener('click', function () {
      console.log('custom open');
      window.$chatbot.toggle('open');
      status.textContent = 'Custom launcher called UChat open';
    });

    closeButton.addEventListener('click', function () {
      console.log('custom close');
      window.$chatbot.toggle('close');
      status.textContent = 'Custom launcher called UChat close';
    });

    window.setInterval(function () {
      if (window.$chatbot && nativeBubbleShouldBeHidden) {
        window.$chatbot.toggleBubbleVisibility('hide');
      }
    }, 250);
  </script>

  <script async defer src="https://portal.zerotools.tech/js/widget/jxjukkd1zbid1cea/float.js"></script>
</body>
</html>
